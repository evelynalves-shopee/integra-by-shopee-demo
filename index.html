<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integra by Shopee — Estrutura do site (apresentação, sem login) · Transportadoras Verificadas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23EE4D2D%22/><path d=%22M5 15 q2 -3 4 0 q2 3 4 0 q2 -3 4 0%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22 stroke-linecap=%22round%22/><circle cx=%2218%22 cy=%227%22 r=%222%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#EE4D2D;--orange-dark:#D3422A;--orange-wash:#FFF1ED;
  --yellow:#FFBB00;--yellow-wash:#FFF7E0;
  --cyan:#26AA99;--cyan-wash:#E7F8F5;
  --red-wash:#FDECEA;
  --grey-bg:#F8F8F9;--grey-line:#ECECEE;--grey-mid:#B3B9C2;--grey-dark:#69707D;
  --ink:#1A1A1A;--white:#FFFFFF;
  --r-sm:8px;--r-md:12px;--r-lg:20px;
  --shadow:0 1px 2px rgba(26,26,26,.04),0 4px 16px rgba(26,26,26,.06);
  --shadow-lift:0 8px 28px rgba(238,77,45,.18);
  font-family:'Roboto',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:var(--grey-bg);color:var(--ink);}
body{-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Nunito',sans-serif;font-weight:800;letter-spacing:-.01em;margin:0;}
button{font-family:'Roboto',sans-serif;cursor:pointer;}
.hidden{display:none!important;}

/* botões e campos */
.btn{border:none;border-radius:var(--r-sm);font-weight:700;font-family:'Nunito',sans-serif;font-size:14px;padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--orange);color:#fff;box-shadow:var(--shadow-lift);}
.btn-primary:hover{background:var(--orange-dark);}
.btn-primary:disabled{background:var(--grey-mid);box-shadow:none;cursor:not-allowed;}
.btn-secondary{background:#fff;color:var(--ink);border:1.5px solid var(--grey-line);}
.btn-secondary:hover{background:var(--grey-bg);border-color:var(--grey-mid);}
.btn-danger{background:#fff;color:#D3422A;border:1.5px solid #f3c2ba;}
.btn-danger:hover{background:var(--red-wash);}
.btn-ok{background:var(--cyan);color:#fff;}
.btn-ok:hover{background:#1e8f80;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-block{width:100%;}
.field{margin-bottom:14px;}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--grey-dark);margin-bottom:6px;font-family:'Nunito',sans-serif;}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field input[type=url],.field input[type=number],.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);font-size:14.5px;background:var(--grey-bg);font-family:inherit;transition:border-color .15s;}
.field textarea{min-height:80px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);background:#fff;}
.field .hint{font-size:12px;color:var(--grey-dark);margin:-2px 0 6px;line-height:1.4;}
.field .req{color:#D3422A;}
.field.err input,.field.err select,.field.err textarea{border-color:#D3422A;}
.field .err-msg{font-size:12px;color:#D3422A;margin-top:4px;}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 12px;}
.opt{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;margin:0;font-weight:400;}
.opt input{width:auto;margin:0;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11.5px;white-space:nowrap;}
.pill-green{background:var(--cyan-wash);color:#12796c;}
.pill-orange{background:var(--orange-wash);color:var(--orange-dark);}
.pill-yellow{background:var(--yellow-wash);color:#8A6200;}
.pill-red{background:var(--red-wash);color:#B3281A;}
.pill-grey{background:var(--grey-line);color:var(--grey-dark);}
.card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:22px;}

/* login / cadastro */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:linear-gradient(160deg,#EE4D2D 0%,#F7A543 100%);}
.auth-hero{color:#fff;padding:56px 56px;display:flex;flex-direction:column;justify-content:center;gap:20px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;}
.brand svg{width:30px;height:30px;}
.verified-tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);padding:6px 14px;border-radius:30px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;}
.auth-hero h1{font-size:38px;line-height:1.1;}
.auth-hero p{margin:0;font-size:16px;line-height:1.5;max-width:480px;opacity:.95;}
.steps-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;}
.steps-list li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4;}
.steps-list .n{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--orange);font-family:'Nunito',sans-serif;font-weight:900;display:flex;align-items:center;justify-content:center;}
.auth-box{display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:#fff;border-radius:var(--r-lg);width:100%;max-width:440px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.tabs{display:flex;background:var(--grey-bg);border-radius:var(--r-sm);padding:4px;margin-bottom:20px;}
.tabs button{flex:1;border:none;background:none;padding:10px;border-radius:6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--grey-dark);}
.tabs button.on{background:#fff;color:var(--orange);box-shadow:var(--shadow);}
.auth-card h2{font-size:20px;margin-bottom:4px;}
.auth-card .sub{color:var(--grey-dark);font-size:13.5px;margin:0 0 18px;line-height:1.4;}
.auth-msg{font-size:13px;color:#B3281A;background:var(--red-wash);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:12px;}
.demo-note{margin-top:16px;font-size:12px;color:var(--grey-dark);text-align:center;line-height:1.5;}

/* app */
.topbar{background:#fff;border-bottom:1px solid var(--grey-line);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5;}
.topbar .brand{color:var(--orange);font-size:19px;}
.topbar .brand svg{width:26px;height:26px;}
.topbar .brand small{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;color:var(--grey-dark);letter-spacing:.3px;text-transform:uppercase;}
.top-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--grey-dark);}
.top-right b{color:var(--ink);}
.main{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
.main.wide{max-width:1180px;}
.hero-prog{background:linear-gradient(135deg,#EE4D2D,#F7A543);color:#fff;border-radius:var(--r-md);padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.hero-prog h2{font-size:21px;}
.hero-prog p{margin:4px 0 0;font-size:13.5px;opacity:.95;}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.step{background:#fff;border:2px solid var(--grey-line);border-radius:var(--r-md);padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .15s;}
.step .ic{width:34px;height:34px;border-radius:50%;background:var(--grey-line);color:var(--grey-dark);display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Nunito',sans-serif;flex-shrink:0;}
.step b{display:block;font-family:'Nunito',sans-serif;font-size:14px;}
.step small{color:var(--grey-dark);font-size:12px;}
.step.active{border-color:var(--orange);}
.step.active .ic{background:var(--orange);color:#fff;}
.step.done .ic{background:var(--cyan);color:#fff;}
.step.locked{opacity:.6;cursor:not-allowed;background:var(--grey-bg);}
.step:not(.locked){cursor:pointer;}
.mod-grid{display:grid;gap:12px;}
.mod-card{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--grey-line);border-radius:var(--r-md);padding:16px 18px;}
.mod-card .num{width:40px;height:40px;border-radius:50%;background:var(--orange-wash);color:var(--orange);font-family:'Nunito',sans-serif;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mod-card.done .num{background:var(--cyan);color:#fff;}
.mod-card .txt{flex:1;}
.mod-card .txt b{font-family:'Nunito',sans-serif;font-size:15px;}
.mod-card .txt p{margin:3px 0 0;font-size:13px;color:var(--grey-dark);}
.video{position:relative;padding-top:56.25%;border-radius:var(--r-md);overflow:hidden;background:#000;margin:14px 0;}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.lesson h4{margin:14px 0 6px;font-size:16px;}
.lesson p,.lesson li{font-size:14.5px;line-height:1.55;}
.q{border:1.5px solid var(--grey-line);border-radius:var(--r-md);padding:16px;margin-bottom:12px;}
.q.ok{border-color:var(--cyan);background:var(--cyan-wash);}
.q.bad{border-color:#e9a79e;background:var(--red-wash);}
.q .qt{font-weight:700;font-size:14.5px;margin-bottom:10px;line-height:1.4;}
.q label.o{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;font-size:14px;cursor:pointer;line-height:1.4;}
.q label.o input{margin-top:3px;}
.q .expl{margin-top:8px;font-size:13px;color:#8e2a1e;line-height:1.45;}
.score-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:16px;}
.lock-box{text-align:center;padding:36px 20px;}
.lock-box .big{font-size:42px;}
.lock-box h3{margin:10px 0 6px;}
.lock-box p{color:var(--grey-dark);margin:0 0 16px;font-size:14px;line-height:1.5;}
.term-text{background:var(--grey-bg);border:1px solid var(--grey-line);border-radius:var(--r-md);padding:18px;max-height:300px;overflow:auto;font-size:14px;line-height:1.6;}
.term-text ol{padding-left:20px;margin:8px 0;}
.signed-box{background:var(--cyan-wash);border:1.5px solid #bcece4;border-radius:var(--r-md);padding:16px 18px;}
.spx-sec{border-top:1px solid var(--grey-line);padding-top:18px;margin-top:18px;}
.spx-sec h4{font-size:16px;margin-bottom:4px;}
.sec-desc{margin:0 0 14px;font-size:13px;color:var(--grey-dark);line-height:1.45;}
.warn{background:var(--yellow-wash);border:1px solid #FFD98A;color:#7a5600;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;line-height:1.45;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-family:'Nunito',sans-serif;font-size:12px;color:var(--grey-dark);text-transform:uppercase;letter-spacing:.3px;padding:10px 12px;border-bottom:1.5px solid var(--grey-line);}
td{padding:12px;border-bottom:1px solid var(--grey-line);vertical-align:middle;}
tr.click:hover{background:var(--grey-bg);cursor:pointer;}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--grey-line);flex-wrap:wrap;}
.doc-row .nm{flex:1;min-width:220px;font-size:14px;}
.doc-row .fn{font-size:12.5px;color:var(--grey-dark);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px;}
.kpi .v{font-family:'Nunito',sans-serif;font-weight:900;font-size:28px;}
.kpi .l{font-size:12.5px;color:var(--grey-dark);margin-top:2px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar input,.toolbar select{padding:10px 12px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);font-size:14px;background:#fff;font-family:inherit;}
.toolbar input{flex:1;min-width:200px;}
.overlay{position:fixed;inset:0;background:rgba(26,26,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
.modal{background:#fff;border-radius:var(--r-lg);max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:26px;}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:13.5px;margin:10px 0;}
.kv dt{color:var(--grey-dark);}
.kv dd{margin:0;word-break:break-word;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-sm);font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.logo-card{align-self:flex-start;background:#fff;border-radius:var(--r-md);padding:14px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
.logo-card img{display:block;height:84px;width:auto;max-width:100%;}
.top-logo{height:38px;width:auto;margin-left:auto;margin-right:8px;}
.seal{background:#fff;border-radius:var(--r-md);padding:8px 14px;}
.seal img{display:block;height:56px;width:auto;}
.navtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:2px solid var(--grey-line);}
.navtabs button{border:none;background:none;padding:11px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--grey-dark);border-bottom:3px solid transparent;margin-bottom:-2px;}
.navtabs button.on{color:var(--orange);border-bottom-color:var(--orange);}
.bdg{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;text-align:center;margin-left:4px;}
.req-item{padding:14px 0;border-bottom:1px solid var(--grey-line);font-size:13.5px;line-height:1.5;}
.reply{margin-top:8px;padding:10px 12px;background:var(--cyan-wash);border-radius:var(--r-sm);color:#12796c;font-size:13px;}
.risk-box{margin-top:14px;padding:14px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);background:var(--grey-bg);}
.risk-box.high{border-color:#D3422A;background:#FFF7F6;}
details.tut{border:1.5px solid var(--grey-line);border-radius:var(--r-md);background:#fff;margin-bottom:10px;}
details.tut summary{padding:14px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14.5px;cursor:pointer;}
details.tut .tb{padding:0 18px 16px;font-size:14px;line-height:1.55;}
details.tut ol{margin:6px 0 0;padding-left:20px;}
.where{font-size:12px;color:var(--grey-dark);font-weight:400;font-family:'Roboto',sans-serif;}
/* ---------- seletor de visualização (desktop / celular) ---------- */
body{--stick:44px;}
#viewbar{position:sticky;top:0;z-index:60;height:44px;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px;font-size:13px;}
#viewbar .seg{display:inline-flex;background:#3a3a3d;border-radius:8px;padding:3px;}
#viewbar .seg button{border:none;background:none;color:#cfcfd4;padding:6px 14px;border-radius:6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;}
#viewbar .seg button.on{background:var(--orange);color:#fff;}
#stage{min-height:calc(100vh - 44px);}
#auth{min-height:calc(100vh - 44px);}
.topbar{top:var(--stick);}
/* celular exibido numa tela grande: moldura de aparelho com rolagem própria */
body.frame-on #stage{background:#dcdce0;display:flex;justify-content:center;align-items:flex-start;padding:20px 0;}
body.frame-on #frame{position:relative;width:390px;height:min(844px,calc(100vh - 44px - 40px));overflow-y:auto;overflow-x:hidden;border-radius:38px;border:10px solid #1A1A1A;box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--grey-bg);transform:translateZ(0);--stick:0px;}
body.frame-on #auth{min-height:100%;}
body.frame-on #frame::-webkit-scrollbar{width:0;}
body.frame-on .overlay{padding:12px;}
body.frame-on #toast{bottom:16px;max-width:calc(100% - 24px);text-align:center;}

/* ---------- layout para celular (aplicado em telas pequenas e na visualização "Celular") ---------- */
body.mob input,body.mob select,body.mob textarea{font-size:16px!important;}
body.mob .btn{min-height:42px;}
body.mob .btn-sm{min-height:36px;}
body.mob #auth{grid-template-columns:1fr;}
body.mob .auth-hero{padding:26px 20px 6px;gap:14px;}
body.mob .auth-hero h1{font-size:26px;}
body.mob .auth-hero p{font-size:14.5px;}
body.mob .logo-card{padding:10px 16px;}
body.mob .logo-card img{height:58px;}
body.mob .auth-box{padding:16px 14px 28px;}
body.mob .auth-card{padding:24px 18px;}
body.mob .topbar{padding:10px 12px;gap:8px;flex-wrap:wrap;}
body.mob .topbar .brand{font-size:16px;}
body.mob .topbar .brand svg{width:22px;height:22px;}
body.mob .top-logo{height:26px;margin-left:auto;margin-right:0;}
body.mob .top-right{width:100%;justify-content:space-between;font-size:12px;}
body.mob #who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68%;}
body.mob .main{padding:16px 12px 48px;}
body.mob .card{padding:16px;}
body.mob .hero-prog{padding:16px;}
body.mob .hero-prog{flex-direction:column;align-items:flex-start;}
body.mob .hero-prog > div[style*="text-align:right"]{text-align:left!important;}
body.mob .hero-prog h2{font-size:17px;}
body.mob .seal img{height:44px;}
body.mob .stepper{grid-template-columns:1fr;gap:8px;}
body.mob .navtabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
body.mob .navtabs::-webkit-scrollbar{display:none;}
body.mob .navtabs button{white-space:nowrap;padding:11px 12px;font-size:13.5px;}
body.mob .mod-card{flex-wrap:wrap;gap:10px;}
body.mob .mod-card .txt{flex:1 1 60%;min-width:0;}
body.mob .mod-card .btn{flex:1 1 100%;}
body.mob .score-bar{flex-direction:column;align-items:stretch;}
body.mob .score-bar .btn{width:100%;}
body.mob .opt-grid{grid-template-columns:1fr;}
body.mob .doc-row{align-items:flex-start;}
body.mob .doc-row .nm{min-width:100%;}
body.mob .kpis{grid-template-columns:repeat(2,1fr);}
body.mob .kpi .v{font-size:24px;}
body.mob .toolbar input{min-width:100%;}
body.mob .toolbar select{width:100%;}
body.mob .kv{grid-template-columns:1fr;gap:2px 0;}
body.mob .kv dt{margin-top:8px;font-size:12px;}
body.mob .modal{padding:18px 16px;border-radius:var(--r-md);max-height:94vh;}
body.mob .term-text{max-height:240px;}
body.mob .lesson h4{font-size:15px;}
body.mob table{font-size:12.5px;}
body.mob th,body.mob td{padding:9px 8px;}
body.frame-on .modal{max-height:100%;}
@media(max-width:860px){
  #viewbar{display:none;}
  body{--stick:0px;}
  #stage{min-height:100vh;}
  #auth{min-height:100vh;}
}

/* =====================================================================
   PERFORMANCE 3PL — tokens de status (sempre com ícone + texto, nunca só cor)
   ===================================================================== */
:root{
  --st-ok:#26AA99;--st-ok-wash:#E7F8F5;--st-ok-ink:#0F6B5F;
  --st-near:#E0A800;--st-near-wash:#FFF7E0;--st-near-ink:#7A5600;
  --st-warn:#F07B1F;--st-warn-wash:#FFEEDD;--st-warn-ink:#9A4508;
  --st-off:#C9301F;--st-off-wash:#FDECEA;--st-off-ink:#A1251A;
  --st-na:#B3B9C2;--st-na-wash:#F1F2F4;--st-na-ink:#69707D;
}
.st{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11.5px;white-space:nowrap;}
.st i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;color:#fff;font-size:9.5px;line-height:1;}
.st-ok{background:var(--st-ok-wash);color:var(--st-ok-ink);} .st-ok i{background:var(--st-ok);}
.st-near{background:var(--st-near-wash);color:var(--st-near-ink);} .st-near i{background:var(--st-near);}
.st-warn{background:var(--st-warn-wash);color:var(--st-warn-ink);} .st-warn i{background:var(--st-warn);}
.st-off{background:var(--st-off-wash);color:var(--st-off-ink);} .st-off i{background:var(--st-off);}
.st-na{background:var(--st-na-wash);color:var(--st-na-ink);} .st-na i{background:var(--st-na);}

.pf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.pf-head h2{font-size:24px;}
.pf-head p{margin:4px 0 0;color:var(--grey-dark);font-size:14px;line-height:1.45;}
.pf-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pf-ctrl select{padding:8px 10px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);font-size:13.5px;background:#fff;font-family:inherit;font-weight:500;}
.pf-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--grey-line);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--grey-dark);font-family:'Nunito',sans-serif;font-weight:700;}

.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px;}
.pk{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:15px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;}
.pk .l{font-size:12px;color:var(--grey-dark);font-weight:500;}
.pk .v{font-family:'Nunito',sans-serif;font-weight:900;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;}
.pk .s{font-size:12px;color:var(--grey-dark);line-height:1.35;}
.pk .st{align-self:flex-start;margin-top:4px;}

.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.sec-title h3{font-size:16px;}
.sec-title span{font-size:12.5px;color:var(--grey-dark);}

/* distribuição por nível */
.dist-row{margin-bottom:14px;}
.dist-row .lb{font-size:12.5px;color:var(--grey-dark);margin-bottom:6px;display:flex;justify-content:space-between;}
.dist-bar{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden;background:#fff;}
.dist-bar>div{display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:#fff;min-width:3px;cursor:pointer;transition:filter .15s;white-space:nowrap;overflow:hidden;}
.dist-bar>div:hover{filter:brightness(.92);}
.dist-bar .b-ok{background:var(--st-ok);} .dist-bar .b-near{background:var(--st-near);color:#3d2b00;} .dist-bar .b-warn{background:var(--st-warn);} .dist-bar .b-off{background:var(--st-off);}
.dist-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.dist-legend button{border:1.5px solid var(--grey-line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;}
.dist-legend button.on{border-color:var(--ink);}
.dist-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}

.pf-two{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:16px;}
.pf-two>.card{min-width:0;}

/* gráfico de dispersão */
.sc-wrap{position:relative;}
.sc-wrap svg{width:100%;height:auto;display:block;}
.sc-wrap .ax{font-size:11px;fill:#69707D;font-family:Roboto,sans-serif;}
.sc-wrap .ref{stroke:#1A1A1A;stroke-width:1.2;stroke-dasharray:4 4;opacity:.55;}
.sc-wrap .grid{stroke:#ECECEE;stroke-width:1;}
.sc-wrap .reflb{font-size:11px;fill:#1A1A1A;font-weight:700;font-family:Nunito,sans-serif;}
.sc-wrap .dot{stroke:#fff;stroke-width:1.5;cursor:pointer;fill-opacity:.8;}
.sc-wrap .dot:hover{fill-opacity:1;stroke:#1A1A1A;}
.sc-wrap .dlb{font-size:10.5px;fill:#1A1A1A;font-weight:700;font-family:Nunito,sans-serif;pointer-events:none;}
.sc-tip{position:absolute;pointer-events:none;background:#1A1A1A;color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;min-width:170px;opacity:0;transition:opacity .1s;z-index:3;}
.sc-tip.on{opacity:1;}
.sc-tip b{font-family:Nunito,sans-serif;font-size:13px;}
.sc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--grey-dark);margin-top:8px;align-items:center;}
.sc-legend .sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;}

/* prioridade de ação */
.prio{display:flex;flex-direction:column;}
.prio-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--grey-line);cursor:pointer;}
.prio-item:last-child{border-bottom:none;}
.prio-item:hover .nm{color:var(--orange);}
.prio-item .rk{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--grey-bg);font-family:Nunito,sans-serif;font-weight:900;font-size:11.5px;display:flex;align-items:center;justify-content:center;color:var(--grey-dark);}
.prio-item .nm{font-family:Nunito,sans-serif;font-weight:800;font-size:13.5px;}
.prio-item .sub{font-size:12px;color:var(--grey-dark);margin:1px 0 5px;}
.reasons{display:flex;gap:4px;flex-wrap:wrap;}
.reasons .st{font-size:11px;padding:2px 8px;}

/* tabela de performance */
.pf-table th.sort{cursor:pointer;user-select:none;white-space:nowrap;}
.pf-table th.sort:hover{color:var(--ink);}
.pf-table th.num,.pf-table td.num{text-align:right;}
.pf-table td{padding:9px 10px;font-variant-numeric:tabular-nums;}
.pf-table th{padding:10px;}
.mv{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-weight:500;font-size:13px;white-space:nowrap;}
.mv i{font-style:normal;font-size:10px;font-weight:900;}
.mv.st-ok{background:var(--st-ok-wash);color:var(--st-ok-ink);}
.mv.st-near{background:var(--st-near-wash);color:var(--st-near-ink);}
.mv.st-warn{background:var(--st-warn-wash);color:var(--st-warn-ink);}
.mv.st-off{background:var(--st-off-wash);color:var(--st-off-ink);}
.mv.st-na{background:var(--st-na-wash);color:var(--st-na-ink);}
tr.noprov td{background:#FAFAFB;color:var(--grey-dark);}
.pf-more{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--grey-dark);}
.toolbar .ck input{flex:none;min-width:0;width:auto;}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--grey-dark);cursor:pointer;}

/* regras / thresholds */
.rules td,.rules th{padding:9px 10px;}
.rules td:first-child{font-weight:700;}
.note-box{background:var(--grey-bg);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--grey-dark);margin-top:12px;}
.note-box b{color:var(--ink);}

/* ---------- visão da transportadora ---------- */
.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;font-size:13.5px;}
.preview-bar b{color:#FFBB00;}
.cv-hero{background:linear-gradient(135deg,#EE4D2D,#F7A543);color:#fff;border-radius:var(--r-md);padding:22px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.cv-hero h2{font-size:22px;}
.cv-hero p{margin:4px 0 0;font-size:13.5px;opacity:.95;}
.cv-hero .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.cv-hero label{font-size:11.5px;font-family:Nunito,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.9;}
.cv-hero select{padding:8px 12px;border:none;border-radius:var(--r-sm);font-size:14px;font-family:inherit;font-weight:500;min-width:170px;}
.cv-hero .tag{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:4px 10px;font-size:12px;font-family:Nunito,sans-serif;font-weight:800;}

.cv-sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.cv-sum .big{font-family:Nunito,sans-serif;font-weight:900;font-size:40px;line-height:1;}
.cv-sum .big small{font-size:18px;color:var(--grey-dark);font-weight:800;}
.cv-sum .txt{flex:1;min-width:220px;}
.cv-sum .txt b{font-family:Nunito,sans-serif;font-size:15.5px;}
.cv-sum .txt p{margin:4px 0 0;font-size:13.5px;color:var(--grey-dark);line-height:1.45;}
.cv-dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

.cv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px;margin-bottom:16px;}
.ind{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--grey-line);min-width:0;}
.ind.b-ok{border-top-color:var(--st-ok);} .ind.b-near{border-top-color:var(--st-near);} .ind.b-warn{border-top-color:var(--st-warn);} .ind.b-off{border-top-color:var(--st-off);} .ind.b-na{border-top-color:var(--st-na);}
.ind .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.ind .nm{font-family:Nunito,sans-serif;font-weight:800;font-size:14.5px;line-height:1.3;}
.ind .val{font-family:Nunito,sans-serif;font-weight:900;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums;}
.ind .meta{font-size:12.5px;color:var(--grey-dark);}
.ind .meta b{color:var(--ink);}
.ind .gap{font-size:13px;font-weight:700;}
.ind .gap.pos{color:var(--st-ok-ink);} .ind .gap.neg{color:var(--st-off-ink);}
.ind .desc{font-size:12px;color:var(--grey-dark);line-height:1.45;border-top:1px solid var(--grey-line);padding-top:8px;margin-top:2px;}
.ind.soon{opacity:.75;background:var(--grey-bg);box-shadow:none;border:1.5px dashed var(--grey-mid);border-top-width:4px;}

/* barra de referência (valor × faixas) */
.bullet{position:relative;height:40px;margin:4px 0 2px;}
.bullet .zones{position:absolute;left:0;right:0;top:8px;height:12px;display:flex;gap:2px;border-radius:6px;overflow:hidden;}
.bullet .zones>div{height:100%;}
.bullet .z-ok{background:#BDE9E2;} .bullet .z-near{background:#FFE6A1;} .bullet .z-warn{background:#FCCFA6;} .bullet .z-off{background:#F6BDB6;}
.bullet .mk{position:absolute;top:2px;width:4px;height:24px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px #fff;}
.bullet .tk{position:absolute;top:22px;font-size:10.5px;color:var(--grey-dark);transform:translateX(-50%);white-space:nowrap;padding-top:4px;}
.bullet .tk:before{content:'';position:absolute;left:50%;top:-4px;width:1px;height:6px;background:var(--grey-dark);}
.bullet .tk.meta{color:var(--ink);font-weight:700;}
.bullet .ovf{position:absolute;right:-2px;top:3px;font-size:11px;font-weight:900;color:var(--ink);}

.cv-table td,.cv-table th{padding:10px 12px;}
.tips{display:grid;gap:10px;}
.tip{border:1.5px solid var(--grey-line);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;line-height:1.5;}
.tip b{font-family:Nunito,sans-serif;}
.tip ul{margin:6px 0 0;padding-left:18px;}
.hist-empty{display:flex;gap:14px;align-items:center;background:var(--grey-bg);border:1.5px dashed var(--grey-mid);border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:var(--grey-dark);line-height:1.45;}
.hist-empty .ic{font-size:26px;}

body.mob .per-row .per-lb{grid-column:1/-1;margin:4px 0 0;}
body.mob .per-row .per-chips{grid-column:1/-1;}
body.mob .per-week{grid-column:1/-1;width:100%;}
body.mob .per-date{width:100%;min-width:0;}
body.mob .per-row .per-lb.dl2{grid-column:auto;}
.per-dates{display:inline-flex;align-items:center;gap:6px;}
.per-to{font-size:12.5px;color:var(--grey-dark);}
.cv-hero .per-to{color:#fff;}
body.mob .per-dates{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;}

/* ---------- VERSÃO DE APRESENTAÇÃO (sem login): mapa do site, seletor de perfil e faixa de aviso ---------- */
#home{min-height:calc(100vh - 44px);background:var(--grey-bg);}
body.frame-on #home{min-height:100%;}
.hm-hero{background:linear-gradient(160deg,#EE4D2D 0%,#F7A543 100%);color:#fff;padding:40px 28px 64px;}
.hm-hero-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.hm-hero h1{font-size:34px;line-height:1.12;max-width:820px;}
.hm-hero p{margin:0;font-size:15.5px;line-height:1.5;max-width:760px;opacity:.97;}
.hm-tag{align-self:flex-start;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:4px 12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;}
.hm-body{max-width:1080px;margin:-34px auto 0;padding:0 20px 60px;display:flex;flex-direction:column;gap:20px;}
.hm-card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);padding:22px;}
.hm-card h2{font-size:19px;margin-bottom:4px;}
.hm-sub{color:var(--grey-dark);font-size:13.5px;margin:0 0 14px;line-height:1.45;}
.hm-legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--grey-dark);}
.hm-flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;}
.hm-step{flex:1 1 150px;background:var(--grey-bg);border-radius:var(--r-md);padding:12px;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column;gap:6px;}
.hm-step b{font-family:'Nunito',sans-serif;font-size:13.5px;}
.hm-step .n{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;}
.hm-arrow{align-self:center;color:var(--grey-mid);font-weight:900;font-size:16px;}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.hm-entry{text-align:left;border:1.5px solid var(--grey-line);background:#fff;border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;}
.hm-entry:hover{border-color:var(--orange);box-shadow:var(--shadow-lift);}
.hm-entry b{font-family:'Nunito',sans-serif;font-size:14.5px;color:var(--ink);}
.hm-entry small{color:var(--grey-dark);font-size:12.5px;line-height:1.4;}
.hm-entry .go{margin-top:auto;padding-top:4px;color:var(--orange);font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;}
.hm-entry.master{border-color:#f3c2ba;background:var(--orange-wash);}
.hm-grp{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey-dark);margin:16px 0 8px;}
.hm-grp:first-of-type{margin-top:4px;}
.hm-row{display:grid;grid-template-columns:200px 1fr 150px auto;gap:12px;align-items:start;padding:12px 0;border-top:1px dashed var(--grey-line);font-size:13.5px;line-height:1.45;}
.hm-row:first-of-type{border-top:none;}
.hm-row .t{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;}
.hm-row .t small{display:block;font-family:'Roboto',sans-serif;font-weight:400;color:var(--grey-dark);font-size:12px;margin-top:2px;}
.hm-list{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);}
.hm-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--grey-dark);}
.pres-banner{background:var(--yellow-wash);color:#8A6200;font-size:12.5px;padding:8px 20px;text-align:center;border-bottom:1px solid #f1deaa;line-height:1.4;}
.pres-sel{padding:7px 10px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;max-width:270px;background:#fff;color:var(--ink);}
.pres-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1.5px dashed #f3c2ba;border-radius:var(--r-md);padding:8px 12px;margin:0 0 16px;font-size:12.5px;color:var(--grey-dark);}
.pres-nav-mid{font-family:'Nunito',sans-serif;font-weight:800;color:var(--ink);}
.pres-nav-sp{flex:1;}
.pres-nav select{padding:6px 8px;border:1.5px solid var(--grey-line);border-radius:var(--r-sm);font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;}
.pres-nav .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
body.mob .pres-nav-sp{display:none;}
body.mob .hm-hero{padding:24px 18px 52px;}
body.mob .hm-hero h1{font-size:24px;}
body.mob .hm-body{padding:0 12px 40px;}
body.mob .hm-row{grid-template-columns:1fr;gap:6px;}
body.mob .hm-arrow{display:none;}
body.mob .hm-step{flex:1 1 100%;}
body.mob .top-right{flex-wrap:wrap;justify-content:flex-start;}
body.mob #who{max-width:100%;width:100%;}
body.mob .pres-sel{flex:1;min-width:0;max-width:none;}
body.mob .pres-banner{padding:8px 12px;font-size:12px;}
</style>

/* ---------- Visualização: desktop / celular ---------- */
const VIEW_KEY = 'integra_apr_view';
let VIEW_MODE = null; // escolha do usuário ('desktop' | 'mobile'); null = automático pela largura da tela
function applyView(){
  const narrow = window.innerWidth <= 860;
  const mobile = narrow || VIEW_MODE === 'mobile';
  document.body.classList.toggle('mob', mobile);
  document.body.classList.toggle('frame-on', mobile && !narrow);
  const dk = document.getElementById('vb-desktop'), mb = document.getElementById('vb-mobile');
  if(dk && mb){ dk.classList.toggle('on', !mobile); mb.classList.toggle('on', mobile); }
}
function setView(m){ if(typeof closeModal === 'function' && document.getElementById('modal-root').innerHTML) closeModal(); VIEW_MODE = m; try { localStorage.setItem(VIEW_KEY, m); } catch(e){} applyView(); }
function goTop(){ const f = document.body.classList.contains('frame-on') ? document.getElementById('frame') : window; f.scrollTo(0, 0); }
const getScroll = () => document.body.classList.contains('frame-on') ? document.getElementById('frame').scrollTop : window.scrollY;
const setScroll = y => (document.body.classList.contains('frame-on') ? document.getElementById('frame') : window).scrollTo(0, y);
try { VIEW_MODE = localStorage.getItem(VIEW_KEY); } catch(e){}
window.addEventListener('resize', applyView);
applyView();

const MODULES = [
  { id:'m1', num:1, title:'Papel da Transportadora no Entrega Direta', desc:'Responsabilidades na coleta, transporte e prazos operacionais.', youtubeId:'tgbNymZ7vqY',
    content:`<h4>Papel no Entrega Direta</h4>
      <p>A transportadora é contratada diretamente pelo vendedor. A Shopee não disponibiliza motoristas para o Entrega Direta.</p>
      <p>A transportadora deve confirmar capacidade, cumprir rotas, registrar coleta/entrega em tempo real e cuidar da integridade da carga.</p>`,
    quiz:[
      { q:'Quem realiza a contratação da transportadora no Entrega Direta?', opts:['A Shopee automaticamente','O próprio Vendedor','O comprador'], correct:1, expl:'No Entrega Direta, a Shopee oferece a plataforma, mas o contrato comercial da transportadora é firmado diretamente pelo vendedor.' },
      { q:'A Shopee disponibiliza motoristas próprios para o Entrega Direta?', opts:['Sim','Não, a coleta e o transporte são de responsabilidade da transportadora contratada','Apenas no interior'], correct:1, expl:'A Shopee não fornece entregadores nem frota neste produto; toda a execução operacional é da transportadora contratada.' },
      { q:'A transportadora deve se comunicar com a Shopee via:', opts:['API aberta / Aplicativo oficial','Apenas e-mails manuais','Telefone'], correct:0, expl:'A sincronização de coletas, rotas e baixas deve ocorrer por integração técnica (API aberta) ou pelo app oficial de entregas.' },
      { q:'As atualizações de status enviadas pela transportadora impactam:', opts:['Apenas a transportadora','Métricas e notas do vendedor contratante','Nada'], correct:1, expl:'A pontualidade e os registros corretos afetam a nota de desempenho e a reputação do vendedor.' },
      { q:'A responsabilidade contratual na operação é:', opts:['Exclusiva da Shopee','Compartilhada entre vendedor e transportadora','Do comprador'], correct:1, expl:'Coletar, transportar, preservar a carga e comprovar a entrega é responsabilidade dividida entre transportadora e vendedor.' }
    ]},
  { id:'m3', num:2, title:'Registro Correto de Etapas (Coleta e Rotas)', desc:'Como registrar coleta, saídas para entrega e checagens.', youtubeId:'tgbNymZ7vqY',
    content:`<h4>Fluxo de Registro</h4>
      <p><b>Atenção:</b> NUNCA registre a coleta antecipadamente. O registro só deve ocorrer com o pacote em posse física do motorista.</p>`,
    quiz:[
      { q:'O motorista pode registrar a coleta antes de retirar o pacote no seller?', opts:['Sim, para adiantar','Não, apenas quando o pacote estiver sob responsabilidade da transportadora','Sim, se estiver no caminho'], correct:1, expl:'Registrar a coleta antes gera alerta falso ao comprador e é infração grave às regras operacionais.' },
      { q:'Quando deve ser feita a atualização de status durante a rota?', opts:['Conforme cada entrega/ocorrência acontece','Apenas no final do dia no galpão','No dia seguinte'], correct:0, expl:'O rastreio exige dados em tempo real: a atualização acontece no momento da entrega ou da tentativa.' },
      { q:'O que verificar antes de sair para a entrega?', opts:['Se os pacotes pertencem ao Entrega Direta e estão identificados','Somente a cor da caixa','Nada'], correct:0, expl:'Conferir etiquetas e canais evita misturar pacotes expressos com cargas padrão e saídas em rotas erradas.' },
      { q:'Finalizar a entrega próximo ao endereço, sem entregar ao comprador, é:', opts:['Permitido','Uma prática incorreta e proibida','Recomendado'], correct:1, expl:'Dar baixa por proximidade, sem a entrega física, é violação de compliance.' },
      { q:'Os pedidos do Entrega Direta podem ser misturados a outros canais?', opts:['Sim, sem restrição','Não, possuem identificação específica','Sempre'], correct:1, expl:'Os volumes do Entrega Direta têm janelas expressas e exigem triagem e tratamento diferenciados.' }
    ]},
  { id:'m4', num:3, title:'Regras de Entrega e Horário Limite (22h)', desc:'Prazos de entrega no mesmo dia / dia seguinte e palavra-chave.', youtubeId:'tgbNymZ7vqY',
    content:`<h4>Regras de Execução das Entregas</h4>
      <ul>
        <li><b>Horário limite:</b> concluir todas as entregas até <b>22h</b>.</li>
        <li><b>Palavra-chave:</b> pedidos que exigem código só devem ser finalizados após a inserção e validação do código fornecido pelo comprador.</li>
      </ul>`,
    quiz:[
      { q:'Qual o horário limite para finalização de entregas do Entrega Direta?', opts:['18h','20h','22h'], correct:2, expl:'A janela máxima para abordagens e baixas de entrega ao consumidor é 22h.' },
      { q:'Quando o pedido solicitar palavra-chave, o entregador deve:', opts:['Solicitar o código ao comprador no recebimento e digitar no app','Finalizar sem código','Pedir o código ao vendedor'], correct:0, expl:'A palavra-chave é de posse exclusiva do comprador e deve ser digitada no app no ato do recebimento.' },
      { q:'As entregas do Entrega Direta são projetadas para quais prazos?', opts:['Mesmo dia ou dia seguinte','15 a 30 dias','60 dias'], correct:0, expl:'A proposta do Entrega Direta é o atendimento expresso local, nas modalidades Same Day ou Next Day.' },
      { q:'Se o motorista estiver próximo ao endereço às 21h50, pode dar baixa sem entregar?', opts:['Sim','Não, a baixa só ocorre na entrega real do pacote','Apenas com autorização verbal'], correct:1, expl:'Mesmo perto do fim do horário, a baixa sem a entrega efetiva ao recebedor é proibida.' },
      { q:'As regras e horários limite da operação podem ser atualizados por quem?', opts:['Pela Shopee','Pelo motorista','Pelo comprador'], correct:0, expl:'As diretrizes globais, SLAs e regras contratuais da plataforma são geridos e atualizados pela Shopee.' }
    ]},

  /* ---------- MÓDULOS OPCIONAIS (aprofundamento: não bloqueiam nenhuma etapa) ---------- */
  { id:'m2', num:4, optional:true, title:'Preparação da Operação e Capacidade', desc:'Planejamento de rotas, área de cobertura e alinhamento de frota.', youtubeId:'tgbNymZ7vqY',
    content:`<h4>Planejamento Operacional</h4>
      <p>Informe apenas regiões que sua transportadora atende de forma consistente. Não assuma volume superior à sua capacidade diária de frota e motoristas.</p>`,
    quiz:[
      { q:'Ao informar a cobertura de atendimento, a transportadora deve cadastrar:', opts:['Apenas regiões que consegue atender com consistência','Qualquer estado do país','Somente capitais'], correct:0, expl:'Cadastrar áreas sem frota ativa ou capacidade gera atrasos severos, cancelamentos e sanções.' },
      { q:'O que fazer se a capacidade de atendimento da transportadora mudar?', opts:['Nada','Manter o vendedor informado para evitar pedidos fora da área','Cancelar a conta na Shopee'], correct:1, expl:'Mudanças no raio de atuação ou no limite de pacotes exigem comunicação imediata e ajuste junto ao vendedor.' },
      { q:'Um planejamento adequado de capacidade ajuda a:', opts:['Atrasar intencionalmente','Cumprir prazos e evitar acúmulo de pacotes','Eliminar a necessidade de motoristas'], correct:1, expl:'Mapear a frota necessária evita pacotes retidos nos galpões e garante o cumprimento dos prazos.' },
      { q:'Onde abrir suporte técnico de integração das transportadoras?', opts:['Atendimento comum','Open Platform','Redes sociais'], correct:1, expl:'Problemas de integração, falhas de API e webhooks devem ser tratados pela Open Platform.' },
      { q:'A frota e a capacidade devem ser calculadas com base em:', opts:['Volume real sustentável de entregas no prazo','Expectativas irrestritas de crescimento','Apenas 1 motorista'], correct:0, expl:'Dimensionar a operação exige considerar o volume que os motoristas realmente concluem dentro do horário limite de 22h.' }
    ]},
  { id:'m5', num:5, optional:true, title:'Tratativa de Ocorrências e Ausência', desc:'Diferença entre comprador ausente e pedido recusado (até 3 tentativas).', youtubeId:'tgbNymZ7vqY',
    content:`<h4>Ocorrências na Entrega</h4>
      <p><b>Diferença fundamental:</b></p>
      <ul>
        <li><b>Comprador ausente:</b> ninguém disponível no local. Pode gerar até 3 tentativas de entrega.</li>
        <li><b>Pedido recusado:</b> comprador presente recusou o pacote. Cancela o pedido imediatamente. Use somente em recusas reais!</li>
      </ul>`,
    quiz:[
      { q:'Se ninguém estiver no local para receber, o entregador deve registrar:', opts:['Pedido recusado','Comprador ausente / tentativa de entrega com evidências','Pedido entregue'], correct:1, expl:'A ausência exige o apontamento de "Comprador ausente", acompanhado de foto comprobatória do local.' },

function hashPw(s){ // DEMO: ofuscação simples, NÃO é segurança real

  async put(key, blob){ try { const d = await this.open(); return await new Promise((res, rej) => { const t = d.transaction('f','readwrite'); t.objectStore('f').put(blob, key); t.oncomplete = () => res(true); t.onerror = () => rej(t.error); }); } catch(e){ return false; } },
  async get(key){ try { const d = await this.open(); return await new Promise((res, rej) => { const q = d.transaction('f').objectStore('f').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); } catch(e){ return null; } }
};
async function viewFile(key, name, download){
  const b = await FILES.get(key);

  if(download){ const a = document.createElement('a'); a.href = url; a.download = name || 'arquivo'; document.body.appendChild(a); a.click(); a.remove(); }
  else window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function onlyDigits(s){ return String(s||'').replace(/\D/g,''); }
function maskCnpj(el){
  const d = onlyDigits(el.value).slice(0,14);
  let o = d;
  if(d.length > 12) o = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5');
  else if(d.length > 8) o = d.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/, '$1.$2.$3/$4');
  else if(d.length > 5) o = d.replace(/^(\d{2})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
  else if(d.length > 2) o = d.replace(/^(\d{2})(\d{0,3}).*/, '$1.$2');
  el.value = o;
}
function fmtCnpj(d){ d = onlyDigits(d); return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : d; }
function validCnpj(v){
  const d = onlyDigits(v);
  if(d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  const calc = len => { let s = 0, p = len - 7; for(let i = 0; i < len; i++){ s += +d[i] * p--; if(p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +d[12] && calc(13) === +d[13];
}

function stageLabel(u){
  if(u.status !== 'andamento') return STATUS[u.status].label;
  if(!allModsDone(u)) return 'Módulos (' + modsDone(u) + '/' + REQ_MODULES.length + ')';
  if(!termSigned(u)) return 'Aguardando termo';
  return 'Cadastro e documentos';
}
function stageOf(u){ return !allModsDone(u) ? 1 : !termSigned(u) ? 2 : 3; }

/* ---------- SESSÃO (sem login nesta versão: perfil e etapa escolhidos pelo apresentador) ---------- */
let SESSION = null;
// perfis de apresentação → conta de exemplo (fictícia) de cada etapa da jornada
const PRES = {
  t0:{ email:'contato@novarota.com.br',      l:'Novo acesso (sem progresso)' },
  t1:{ email:'operacoes@rapidolog.com.br',   l:'Etapa 1 · módulos em andamento' },
  t2:{ email:'logistica@transmax.com.br',    l:'Etapa 2 · termo de aceite' },
  t3:{ email:'contato@expressosul.com.br',   l:'Etapa 3 · cadastro e documentos' },

function enterAs(key, tab){

function goHome(){

}
function logout(){ goHome(); } // chamadas internas de segurança (conta inexistente) voltam ao mapa
function resetPres(){
  if(!confirm('Restaurar os dados de exemplo? As alterações feitas nesta apresentação serão descartadas.')) return;
  DB = seedDb(); PERF_LINKS = loadLinks(); toast('Dados de exemplo restaurados.');
}


/* ---------- apresentação: navegação livre entre etapas, módulos e situações da conta ---------- */
const PRES_MODS = () => [...REQ_MODULES, ...OPT_MODULES];
const presModIdx = id => PRES_MODS().findIndex(m => m.id === id);
function presMod(dir){ const l = PRES_MODS(), i = presModIdx(SESSION.moduleId) + dir; if(i >= 0 && i < l.length) openModule(l[i].id); }
function presEnsureMods(u){ REQ_MODULES.forEach(m => { if(!(u.modules[m.id] && u.modules[m.id].done)) u.modules[m.id] = { done:true, attempts:1, doneAt:new Date().toISOString() }; }); }
function presEnsureTerm(u){ presEnsureMods(u); if(!termSigned(u)) u.term = { signedAt:new Date().toISOString(), name:'Responsável (demonstração)' }; }
function presStep(dir){ const n = Math.min(3, Math.max(1, (SESSION.step || stageOf(me())) + dir)); SESSION.step = n; SESSION.moduleId = null; render(); goTop(); }
function presStatus(v){
  const u = me(); if(!u) return;
  if(v === 'andamento'){ u.status = 'andamento'; u.submittedAt = null; u.note = ''; u.docStatus = {}; u.risk = null; }
  else {
    presEnsureTerm(u);
    if(!u.submittedAt || !Object.keys(u.form || {}).length){ // preenche com os dados de exemplo da conta "em análise"
      const ex = seedDb().users.find(x => x.email === 'adm@veloztrans.com.br');
      u.form = Object.assign({}, ex.form, u.form || {}); u.docs = Object.assign({}, ex.docs, u.docs || {}); u.submittedAt = new Date().toISOString();
    }
    u.status = v; u.note = ''; u.docStatus = {}; u.risk = null;
    requiredDocs(u).forEach(n => u.docStatus[n] = v === 'aprovada' ? 'approved' : 'pending');
    if(v === 'aprovada'){ u.risk = 'baixo'; u.reviewedAt = new Date().toISOString(); u.reviewedBy = PRES.master.email; }
    if(v === 'recusada'){ u.note = 'Parecer de exemplo: o Contrato Social está ilegível. Envie o documento novamente.'; u.docStatus[DOCS[0]] = 'rejected'; u.reviewedAt = new Date().toISOString(); u.reviewedBy = PRES.master.email; }
  }
  SESSION.step = 3; saveDb(); render(); goTop();
}
function presReset(){
  const u = me(); if(!u) return;
  Object.assign(u, { modules:{}, term:null, form:{}, docs:{}, submittedAt:null, status:'andamento', note:'', docStatus:{}, risk:null, riskAuth:null, reviewedAt:null, reviewedBy:null });
  SESSION.step = 1; SESSION.moduleId = null; render(); goTop(); toast('Conta zerada: a jornada recomeça na Etapa 1.');
}
function presNavHtml(u){
  const n = SESSION.step || stageOf(u), sit = u.status;
  return `<div class="pres-nav"><button type="button" class="btn btn-secondary btn-sm" onclick="presStep(-1)" ${n <= 1 ? 'disabled' : ''}>← Etapa anterior</button>
    <span class="pres-nav-mid">Etapa ${n} de 3</span>
    <button type="button" class="btn btn-primary btn-sm" onclick="presStep(1)" ${n >= 3 ? 'disabled' : ''}>Próxima etapa →</button>
    <span class="pres-nav-sp"></span>
    <label>Situação da conta: <select onchange="presStatus(this.value)">${[['andamento','Em andamento'],['analise','Em análise'],['aprovada','Verificada'],['recusada','Recusada']].map(([k, l]) => `<option value="${k}" ${sit === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <button type="button" class="btn btn-danger btn-sm" onclick="presReset()">↺ Zerar esta conta</button></div>`;
}

/* ---------- RENDER PRINCIPAL ---------- */
function render(){
  if(!SESSION) return;
  $('view').classList.toggle('wide', SESSION.master);

}

/* =================== TRANSPORTADORA =================== */
function tabsHtml(list){

}
function setTab(k){ SESSION.tab = k; SESSION.moduleId = null; render(); goTop(); }
function carrierTabs(u){
  const n = DB.requests.filter(r => r.email === u.email && ['respondida','aceita','recusada'].includes(r.status) && !r.seen).length;
  return tabsHtml([['jornada','Minha jornada'], ...(perfProviderOf(u.cnpj) ? [['performance','📊 Minha performance']] : []), ['ajuda','Dúvidas e solicitações', n], ['tutoriais','Tutoriais']]);
}
function renderCarrier(u){
  $('view').classList.toggle('wide', SESSION.tab === 'performance');

  const stage = stageOf(u);
  if(!SESSION.step) SESSION.step = stage;
  // apresentação: nenhuma etapa fica bloqueada; o apresentador volta e avança livremente
  const st = n => n < stage || (n === 3 && u.status !== 'andamento') ? 'done' : n === stage ? 'active' : 'todo';
  const pct = Math.round(((modsDone(u) + (termSigned(u) ? 1 : 0) + (u.submittedAt ? 1 : 0)) / (REQ_MODULES.length + 2)) * 100);
  const sInfo = STATUS[u.status];
  const view = $('view');
  view.innerHTML = carrierTabs(u) + `
    <div class="hero-prog">
      <div><h2>Programa de Transportadoras Verificadas</h2>

      ${u.status === 'aprovada' ? `<div class="seal"><img src="${LOGO_PVT}" alt="Transportadora verificada"></div>` : `<div style="text-align:right"><div style="font-family:Nunito;font-weight:900;font-size:30px;">${pct}%</div><div style="font-size:12px;opacity:.9">da jornada concluída</div></div>`}
    </div>
    <div class="stepper">
      ${stepHtml(1,'Módulos obrigatórios', modsDone(u)+' de '+REQ_MODULES.length+' com 100%', st(1), u)}
      ${stepHtml(2,'Termo de aceite', termSigned(u) ? 'Assinado' : (allModsDone(u) ? 'Pronto para assinar' : 'Prévia · ainda não liberada'), st(2), u)}
      ${stepHtml(3,'Cadastro e documentos', u.submittedAt ? 'Enviado' : (termSigned(u) ? 'Pronto para preencher' : 'Prévia · ainda não liberada'), st(3), u)}
    </div>
    ${presNavHtml(u)}
    <div id="step-body"></div>`;
  const body = $('step-body');
  if(SESSION.moduleId && SESSION.step === 1) renderModule(body, u, SESSION.moduleId);
  else if(SESSION.step === 1) renderModuleList(body, u);
  else if(SESSION.step === 2) renderTerm(body, u);
  else renderRegistration(body, u);
}
function stepHtml(n, title, sub, state, u){
  const locked = state === 'locked';
  const active = SESSION.step === n;
  const ic = state === 'done' ? '✓' : locked ? '🔒' : n;
  return `<button type="button" class="step ${state} ${active && !locked ? 'active' : ''}" ${locked ? 'disabled' : ''} onclick="goStep(${n})">
    <span class="ic">${ic}</span><span><b>${n}. ${esc(title)}</b><small>${esc(sub)}</small></span></button>`;
}
function goStep(n){
  SESSION.step = n; SESSION.moduleId = null; render(); goTop();
}

/* ----- Etapa 1: módulos ----- */
function modCardHtml(m, u){
  const d = u.modules[m.id] && u.modules[m.id].done;
  return `<div class="mod-card ${d ? 'done' : ''}"><div class="num">${d ? '✓' : m.num}</div>
    <div class="txt"><b>Módulo ${m.num} — ${esc(m.title)}</b><p>${esc(m.desc)}</p></div>
    <span class="pill ${d ? 'pill-green' : (m.optional ? 'pill-yellow' : 'pill-grey')}">${d ? '100% ✓' : (m.optional ? 'Opcional' : 'Pendente')}</span>
    <button class="btn ${d ? 'btn-secondary' : (m.optional ? 'btn-secondary' : 'btn-primary')} btn-sm" onclick="openModule('${m.id}')">${d ? 'Rever' : 'Abrir'}</button></div>`;

function renderModuleList(c, u){
  c.innerHTML = `<div class="card">
    <h3 style="font-size:18px">Módulos obrigatórios</h3>
    <p style="color:var(--grey-dark);font-size:14px;line-height:1.5;margin:6px 0 16px">Assista ao vídeo, leia o conteúdo e responda ao quiz. Em cada módulo é <b>necessário acertar 100%</b> das questões. Você pode refazer as respostas quantas vezes precisar.</p>
    <div class="mod-grid">${REQ_MODULES.map(m => modCardHtml(m, u)).join('')}</div>
    ${allModsDone(u) ? `<div class="signed-box" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>🎉 <b>Módulos obrigatórios concluídos!</b> ${termSigned(u) ? 'O termo já foi assinado.' : 'O termo de aceite foi liberado.'}</span>${termSigned(u) ? '' : '<button class="btn btn-primary" onclick="goStep(2)">Ir para o termo de aceite →</button>'}</div>` : ''}
    <div class="spx-sec" style="margin-top:26px">
      <h3 style="font-size:18px">Módulos opcionais <span class="pill pill-yellow" style="margin-left:6px;vertical-align:middle">${optDone(u)}/${OPT_MODULES.length} concluídos</span></h3>
      <p style="color:var(--grey-dark);font-size:14px;line-height:1.5;margin:6px 0 16px">Conteúdo de aprofundamento sobre a operação. <b>Não são necessários</b> para liberar o termo nem o cadastro, mas ajudam sua equipe a operar dentro das regras da Shopee.</p>
      <div class="mod-grid">${OPT_MODULES.map(m => modCardHtml(m, u)).join('')}</div>
    </div>
  </div>`;
}function openModule(id){ SESSION.moduleId = id; SESSION.answers = {}; SESSION.result = null; render(); goTop(); }
function renderModule(c, u, id){
  const m = MODULES.find(x => x.id === id);
  const done = u.modules[id] && u.modules[id].done;

  c.innerHTML = `<div class="card">

    <h3 style="font-size:19px;margin-top:14px">Módulo ${m.num} — ${esc(m.title)} ${m.optional ? '<span class="pill pill-yellow" style="vertical-align:middle">Opcional</span>' : ''}</h3>
    <div class="video"><iframe src="https://www.youtube.com/embed/${m.youtubeId}" title="${esc(m.title)}" allowfullscreen loading="lazy"></iframe></div>

    <div id="quiz">${m.quiz.map((q, i) => {

    }).join('')}</div>

      <div id="score-txt" style="font-size:14px;color:var(--grey-dark)">${res ? (res.wrong.size === 0 ? '✅ 100% de acerto!' : '⚠️ ' + (m.quiz.length - res.wrong.size) + ' de ' + m.quiz.length + ' corretas — ajuste as marcadas e envie de novo.') : 'Responda todas as questões.'}</div>
      <button class="btn btn-primary" onclick="checkQuiz('${id}')">Verificar respostas</button>
    </div></div>`;
}
function checkQuiz(id){
  const m = MODULES.find(x => x.id === id), u = me();
  if(m.quiz.some((q, i) => SESSION.answers[i] === undefined)) return toast('Responda todas as questões antes de verificar.');
  const wrong = new Set();
  m.quiz.forEach((q, i) => { if(SESSION.answers[i] !== q.correct) wrong.add(i); });
  const rec = u.modules[id] || (u.modules[id] = { done:false, attempts:0 });
  rec.attempts++;
  const wasAll = allModsDone(u);
  if(wrong.size === 0){
    rec.done = true; rec.doneAt = new Date().toISOString();
    saveDb();
    SESSION.moduleId = null; SESSION.result = null;
    if(!m.optional && !wasAll && allModsDone(u)){ SESSION.step = 2; toast('🎉 Módulos concluídos! O termo de aceite foi liberado.'); }
    else toast('Módulo concluído com 100%!');
    render(); goTop();
    return;
  }
  // mantém só as respostas certas; as erradas precisam ser refeitas
  wrong.forEach(i => delete SESSION.answers[i]);
  SESSION.result = { wrong };
  saveDb(); render();
  const first = document.querySelector('.q.bad'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ----- Etapa 2: termo de aceite ----- */

/* ----- Etapa 3: cadastro e documentos ----- */
let FORM_ERRORS = {};
function visible(cond, data){ return !cond || (Array.isArray(data[cond[0]]) ? data[cond[0]].includes(cond[1]) : data[cond[0]] === cond[1]); }
function fieldHtml(f, data, errors){
  const v = data[f.id], err = errors[f.id], locked = ['analise','aprovada'].includes(me().status);

  else if(f.type === 'textarea') inp = `<textarea ${dis} oninput="setField('${f.id}',this.value)">${esc(v||'')}</textarea>`;
  else inp = `<input type="${f.type}" ${dis} value="${esc(v||'')}" oninput="setField('${f.id}',this.value)">`;

}
function setField(id, val, rerender){

}
function toggleField(id, val, on){
  const u = me(); const a = new Set(u.form[id] || []); on ? a.add(val) : a.delete(val); u.form[id] = [...a]; saveDb();
}
function renderRegistration(c, u, keepScroll){
  const y = getScroll();
  const locked = ['analise','aprovada'].includes(u.status);
  const banner = u.status === 'analise' ? `<div class="signed-box" style="margin-bottom:16px">📨 <b>Cadastro enviado em ${esc(fmtDate(u.submittedAt))} e em análise.</b> Nossa equipe entrará em contato. Os campos estão bloqueados enquanto a análise acontece.</div>`
    : u.status === 'aprovada' ? `<div class="signed-box" style="margin-bottom:16px">✅ <b>Parabéns! Sua transportadora é verificada pela Shopee.</b></div>`

  const sections = FORM.map(s => `<div class="spx-sec"><h4>${esc(s.title)}</h4>${s.desc ? `<p class="sec-desc">${esc(s.desc)}</p>` : ''}${s.fields.filter(f => visible(f.showIf, u.form)).map(f => fieldHtml(f, u.form, FORM_ERRORS)).join('')}</div>`).join('');
  const docs = requiredDocs(u);
  c.innerHTML = `<div class="card">
    <h3 style="font-size:18px">Cadastro e envio de documentos</h3>
    <p class="sec-desc" style="margin-top:6px">Preencha todos os campos obrigatórios (<span style="color:#D3422A">*</span>) e anexe os documentos. Suas respostas são salvas automaticamente.</p>
    ${termSigned(u) ? '' : '<div class="warn">👀 <b>Prévia:</b> nesta conta o termo ainda não foi assinado. Na apresentação, enviar o cadastro assina o termo e conclui os módulos automaticamente.</div>'}

    ${banner}

function attachDoc(i, input){
  const f = input.files[0]; if(!f) return;
  if(f.size > 10*1024*1024){ input.value = ''; return toast('Arquivo maior que 10 MB.'); }
  const u = me();
  FILES.put(u.email + '|' + DOCS[i], f).then(ok => { if(!ok) toast('Não foi possível guardar o arquivo neste navegador (só o nome foi salvo).'); });
  u.docs[DOCS[i]] = f.name; u.docStatus[DOCS[i]] = 'pending'; saveDb(); renderRegistration($('step-body'), u, true);
}
function submitRegistration(){
  const u = me();
  FORM_ERRORS = {};
  FORM.forEach(s => s.fields.forEach(f => {
    if(!f.req || !visible(f.showIf, u.form)) return;
    const v = u.form[f.id];
    if(f.type === 'checkbox' ? !(v && v.length) : !String(v ?? '').trim()) { FORM_ERRORS[f.id] = 'Campo obrigatório.'; return; }
    if(f.type === 'email' && !validEmail(v)) FORM_ERRORS[f.id] = 'E-mail inválido.';
    if(f.type === 'url' && !/^https?:\/\/.+\..+/.test(v)) FORM_ERRORS[f.id] = 'Informe a URL completa (https://…).';
    if(f.type === 'tel' && !/^\d{10,11}$/.test(onlyDigits(v))) FORM_ERRORS[f.id] = 'Informe DDD + número, somente números.';
    if(f.id === 'integ_ciente' && v === 'Não') FORM_ERRORS[f.id] = 'A integração é obrigatória para participar do programa.';
  }));
  const missing = requiredDocs(u).filter(n => !u.docs[n]);
  if(missing.length) FORM_ERRORS._docs = 'Anexe todos os documentos obrigatórios (faltam ' + missing.length + ').';
  const keys = Object.keys(FORM_ERRORS);
  if(keys.length){
    renderRegistration($('step-body'), u);
    toast('Revise os campos destacados.');
    const first = document.querySelector('.field.err') || document.querySelector('.err-msg');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  presEnsureTerm(u);
  requiredDocs(u).forEach(n => { if(dstat(u, n) !== 'approved') u.docStatus[n] = 'pending'; });
  u.status = 'analise'; u.submittedAt = new Date().toISOString(); u.note = ''; saveDb();
  toast('Cadastro enviado para análise!'); render(); goTop();
}

function placeOverlay(){ // na moldura de celular, fixa a janela sobre a área visível e trava a rolagem do fundo

}

function decide(email, status){
  const u = findUser(email), note = (MD[email] !== undefined ? MD[email] : (u.note || '')).trim();
  if(status === 'analise'){ u.status = 'analise'; saveDb(); closeModal(); render(); return toast('Voltou para análise.'); }
  const docs = requiredDocs(u);
  if(docs.some(n => dstat(u, n) === 'pending')) return toast('Há documentos em análise. Marque cada um como Aprovado ou Recusado antes de decidir.');
  if(status === 'aprovada'){
    if(docs.some(n => dstat(u, n) === 'rejected')) return toast('Para aprovar, todos os documentos devem estar Aprovados.');
    if(!u.risk) return toast('Compliance: classifique o risco (Baixo, Médio ou Alto) antes de aprovar.');
    if(u.risk === 'alto' && !u.riskAuth) return toast('Risco ALTO: anexe a autorização da Camila No para aprovar.');
  } else {
    if(!docs.some(n => dstat(u, n) === 'rejected')) return toast('Para recusar, ao menos um documento deve estar Recusado.');
    if(!note) return toast('Preencha o parecer para recusar.');
  }
  u.status = status; u.note = note; u.reviewedAt = new Date().toISOString(); u.reviewedBy = SESSION.email; delete MD[email]; saveDb();
  closeModal(); render(); toast(status === 'aprovada' ? 'Transportadora verificada!' : 'Cadastro recusado. A transportadora poderá corrigir e reenviar.');

function genPw(){ const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint32Array(10)); r.forEach(n => s += a[n % a.length]); return s; }
function fillPw(){ $('nc-pw').value = genPw(); }
function createAccount(email, cnpjRaw, pw){
  email = String(email||'').trim().toLowerCase(); const cnpj = onlyDigits(cnpjRaw);
  if(!validEmail(email)) return { ok:false, msg:'E-mail inválido' };
  if(email === PRES.master.email) return { ok:false, msg:'E-mail reservado' };
  if(!validCnpj(cnpj)) return { ok:false, msg:'CNPJ inválido' };
  if(findUser(email)) return { ok:false, msg:'E-mail já cadastrado' };
  if(DB.users.some(u => u.cnpj === cnpj)) return { ok:false, msg:'CNPJ já cadastrado' };
  if(pw.length < 8) return { ok:false, msg:'Senha com menos de 8 caracteres' };
  DB.users.push(newUser(email, cnpj, pw, { createdBy: SESSION.email }));
  return { ok:true, msg:'Criada' };
}
function createOne(){
  const email = $('nc-email').value, cnpj = $('nc-cnpj').value, pw = $('nc-pw').value;
  const r = createAccount(email, cnpj, pw);
  MS.created = [{ email:email.trim().toLowerCase(), cnpj:onlyDigits(cnpj), pw, ...r }];
  if(r.ok) saveDb(); renderMaster(); toast(r.ok ? 'Cadastro criado.' : r.msg);
}
function createBatch(){
  const lines = $('nc-batch').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!lines.length) return toast('Cole ao menos uma linha: e-mail;CNPJ');
  MS.created = lines.map(l => {
    const parts = l.split(/[;,\t ]+/).filter(Boolean);
    const email = parts.find(p => p.includes('@')) || '', cnpj = parts.find(p => !p.includes('@') && onlyDigits(p).length >= 11) || '';
    const pw = genPw(); const r = createAccount(email, cnpj, pw);
    return { email, cnpj:onlyDigits(cnpj), pw, ...r };
  });
  saveDb(); renderMaster(); toast(MS.created.filter(x => x.ok).length + ' de ' + MS.created.length + ' cadastros criados.');
}

  const rows = [['E-mail','CNPJ','Senha provisória','Resultado'], ...MS.created.map(x => [x.email, fmtCnpj(x.cnpj), x.ok ? x.pw : '', x.msg])];

/* desagrega cada mês em dias: volumes inteiros que somam o mês; % recentrados no valor do mês */
const VOL = new Int32Array(P * ND), MET = Object.fromEntries(QK.map(k => [k, new Float32Array(P * ND).fill(NaN)]));

  const EVQ = { '2025-11-28':-.05, '2025-11-29':-.06, '2025-11-30':-.05, '2025-12-01':-.04, '2025-12-02':-.03, '2025-12-24':-.03 };
  const SDDW = [.015, .015, .01, .005, 0, -.045, -.05], SD = { otdr:.012, sdd:.02, fa:.008, mon:.02 };
  KPI_HIST.rows.forEach((row, p) => {
    MONTHS.forEach((m, mi) => {
      const V = row[1][mi]; if(!V) return;
      const R = rng(hashStr(row[0] + '|' + m)), a = dIdx(m + '-01'), b = dIdx(monthEnd(m)), n = b - a + 1;
      const sig = Math.min(.35, .06 + 1.5 / Math.sqrt(V));
      const w = []; for(let i = a; i <= b; i++) w.push(DOWF[dow(i)] * (EV[dStr(i)] || 1) * Math.exp(gauss(R) * sig));
      const W = w.reduce((s, x) => s + x, 0), raw = w.map(x => x / W * V), vol = raw.map(Math.floor);
      let rest = V - vol.reduce((s, x) => s + x, 0);
      raw.map((x, j) => [x - Math.floor(x), j]).sort((x, y) => y[0] - x[0]).slice(0, rest).forEach(([, j]) => vol[j]++);
      QK.forEach(k => {
        const base = row[KIDX[k]][mi]; if(base == null) return;
        const dev = vol.map((v, j) => { const i = a + j; return gauss(R) * SD[k] * (1 + 4 / Math.sqrt(v + 1)) + (k === 'sdd' ? SDDW[dow(i)] : 0) + (k === 'fa' ? -(EVQ[dStr(i)] || 0) * .4 : (EVQ[dStr(i)] || 0)); });

/* ---------- períodos: chave "AAAA-MM-DD_AAAA-MM-DD" ---------- */
const PKEY = (a, b) => a + '_' + b;
const pParts = key => key.split('_');

const isMonday = s => dow(dIdx(s)) === 0;
function monthSpan(key){ // nº de meses civis se o período começa no dia 1 e termina no fim do mês (ou no último dia com dados)

}
const isWeek = key => { const [a, b] = pParts(key); return isMonday(a) && dIdx(b) - dIdx(a) === 6; };
const volNorm = key => !(monthSpan(key) === 1 && pParts(key)[1] === monthEnd(pParts(key)[0].slice(0, 7)));   // volume convertido p/ ritmo mensal?
function perLabel(key){
  const [a, b] = pParts(key), ms = monthSpan(key);
  if(ms === 1) return mLabel(a.slice(0, 7)) + (b !== monthEnd(a.slice(0, 7)) ? ' (até ' + fmtD(b) + ')' : '');
  if(ms > 1) return mShort(a.slice(0, 7)) + ' – ' + mShort(b.slice(0, 7)) + ' (' + ms + ' meses' + (b !== monthEnd(b.slice(0, 7)) ? ', até ' + fmtD(b) : '') + ')';
  if(isWeek(key)) return 'Semana ' + fmtD(a) + ' – ' + fmtD(b, true);
  const n = pDays(key); return a === b ? fmtD(a, true) : fmtD(a, true) + ' – ' + fmtD(b, true) + ' (' + n + ' dias' + (n % 7 === 0 && isMonday(a) ? ' · ' + n / 7 + ' semanas' : '') + ')';
}
function prevKey(key){
  const [a, b] = pParts(key), ms = monthSpan(key);
  if(ms){ const pa = addMonths(a.slice(0, 7), -ms); if(pa < DAY0.slice(0, 7)) return null;
    const pbM = addMonths(b.slice(0, 7), -ms), pb = b === monthEnd(b.slice(0, 7)) ? monthEnd(pbM) : pbM + '-' + String(Math.min(+b.slice(8), +monthEnd(pbM).slice(8))).padStart(2, '0');
    return PKEY(pa + '-01', pb); }

  return `<span class="sim-badge" title="Só o total de Out/2026 é real (planilha). Os demais meses e toda a abertura por dia/semana são simulados para testar o filtro.">⚗️ ${inOct ? 'Dias simulados a partir do total real' : 'Dados simulados'}</span>`;
}
const monthIdxRange = key => { const [a, b] = pParts(key); return [MI[a.slice(0, 7)], MI[b.slice(0, 7)]]; };

/* ---------- agregação por período (qualquer intervalo de dias) ---------- */
const _cache = {};
function periodRows(key){
  if(_cache[key]) return _cache[key];
  const [a, b] = pParts(key), ia = Math.max(0, dIdx(a)), ib = Math.min(ND - 1, dIdx(b)), days = ib - ia + 1, out = [];
  const norm = volNorm(key) ? 30.4375 / days : 1;
  KPI_HIST.rows.forEach((row, p) => {
    let tot = 0; const acc = { otdr:[0,0], sdd:[0,0], fa:[0,0], mon:[0,0] }, o = p * ND;
    for(let i = ia; i <= ib; i++){ const v = VOL[o + i]; if(!v) continue; tot += v;
      for(const k of QK){ const x = MET[k][o + i]; if(x === x){ acc[k][0] += x * v; acc[k][1] += v; } } }
    if(!tot) return;
    const r = { n: row[0], volTot: tot, vol: tot * norm, days, noProv: row[0] === 'no provider', st:{} };
    for(const k of QK) r[k] = acc[k][1] ? acc[k][0] / acc[k][1] : null;
    KPI_DEFS.forEach(d => r.st[d.k] = kpiStatus(d, r[d.k]));
    r.level = KPI_DEFS.map(d => r.st[d.k]).reduce((x, s) => LV[s].rank > LV[x].rank ? s : x, 'ok');
    r.fails = KPI_DEFS.filter(d => ['warn','off','near'].includes(r.st[d.k])).map(d => d.k);

}

  return { n: rows.length, vol: tot, volTot: rows.reduce((s, r) => s + r.volTot, 0), otdr: w('otdr'), sdd: w('sdd'), fa: w('fa'), mon: w('mon') };
}

/* ---------- baldes para gráficos: semanas (seg→dom) e meses ---------- */
const BUCKETS = {

/* variação vs período anterior */

  const diff = v - pv, good = d.dir === 'up' ? diff > 0 : diff < 0, flat = d.fmt === 'int' ? Math.abs(diff) < 0.5 : Math.abs(diff) < 0.00005;

/* ---------- seletor de período: atalhos (semanas/meses) + semana + De/Até livre ---------- */

/* ---------- tooltip genérico (elementos com data-tip) ---------- */
function bindTips(wrap){
  if(!wrap) return; let tip = wrap.querySelector(':scope > .sc-tip');
  if(!tip){ tip = document.createElement('div'); tip.className = 'sc-tip'; wrap.appendChild(tip); }
  wrap.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tip.innerHTML = el.dataset.tip; tip.classList.add('on');
      const wr = wrap.getBoundingClientRect(), er = el.getBoundingClientRect();
      const x = er.left - wr.left + er.width / 2, y = er.top - wr.top;
      tip.style.left = Math.min(Math.max(x + 10, 0), wr.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = Math.max(y - tip.offsetHeight - 8, 0) + 'px';
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('on'));
  });
}

/* ---------- mini gráfico (pequenos múltiplos; um eixo por gráfico) ---------- */
function miniChart(d, series, key, opts = {}){
  const gran = opts.gran || 'month', bks = BUCKETS[gran], n = bks.length;
  const W = 320, H = 150, m = { l:46, r:16, t:14, b:22 }, step = (W - m.l - m.r) / n;
  const X = i => m.l + step * (i + .5);
  const isVol = d.fmt === 'int', vals = series.map(s => s ? (isVol ? s.volTot : s[d.k]) : null), have = vals.filter(v => v != null);
  if(!have.length) return '<div class="sec-desc">Sem dados.</div>';
  const showRef = !isVol || (gran === 'month' && !opts.network);
  let y0, y1;
  if(isVol){ y0 = 0; y1 = Math.max(...have, showRef ? d.entry : 0) * 1.12; }
  else { const lo = Math.min(...have, d.entry, d.off), hi = Math.max(...have, d.entry); const pad = Math.max((hi - lo) * .15, .01); y0 = Math.max(0, lo - pad); y1 = Math.min(1, hi + pad); }
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const fmtAx = v => isVol ? (v === 0 ? '0' : v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mi' : v >= 1000 ? Math.round(v / 1000) + ' mil' : Math.round(v)) : Math.round(v * 100) + '%';
  const sel = bks.map((bk, i) => overlaps(bk, key) ? i : -1).filter(i => i >= 0);
  let g = sel.length ? `<rect x="${X(sel[0]) - step / 2}" y="${m.t - 6}" width="${step * (sel[sel.length - 1] - sel[0] + 1)}" height="${H - m.b - m.t + 6}" class="mc-sel"/>` : '';

  const every = Math.ceil(n / 6);
  bks.forEach((bk, i) => { if((n - 1 - i) % every === 0) g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle">${bk.lab}</text>`; });
  const tipSt = s => opts.network && isVol ? '' : '<br>' + LV[s].ic + ' ' + LV[s][opts.carrier ? 'cl' : 'l'];
  const simTxt = bk => bk.key === REAL_KEY ? '' : '<br><i>simulado</i>';
  if(isVol){
    const bw = Math.max(step - (gran === 'week' ? 1.5 : 6), 2);
    vals.forEach((v, i) => { if(v == null) return; const s = kpiStatus(d, series[i].vol);
      g += `<rect class="mc-bar" x="${X(i) - bw / 2}" y="${Y(v)}" width="${bw}" height="${Math.max(Y(0) - Y(v), 1)}" rx="${gran === 'week' ? 1 : 3}" fill="${opts.network ? '#B3B9C2' : LV_COLOR[s]}" data-tip="<b>${bks[i].long}</b><br>${intF(v)} pedidos${gran === 'week' && !opts.network ? '<br>ritmo mensal: ' + intF(series[i].vol) : ''}${tipSt(s)}${simTxt(bks[i])}"/>`; });
    if(showRef) g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(d.entry)}" y2="${Y(d.entry)}"/>`;
  } else {
    g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(d.entry)}" y2="${Y(d.entry)}"/>`;
    let path = '', pen = false;
    vals.forEach((v, i) => { if(v == null){ pen = false; return; } path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    g += `<path d="${path}" class="mc-line"/>`;
    const r = gran === 'week' ? 3 : 4.5;
    vals.forEach((v, i) => { if(v == null) return; const s = kpiStatus(d, v);
      g += `<circle cx="${X(i)}" cy="${Y(v)}" r="${r}" class="mc-dot${gran === 'week' ? ' sm' : ''}" fill="${LV_COLOR[s]}" data-tip="<b>${bks[i].long}</b><br>${d.short}: ${pctF(v)}${tipSt(s)}${simTxt(bks[i])}"/>`; });
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="mc" role="img" aria-label="${d.label} por ${gran === 'week' ? 'semana' : 'mês'}">${g}</svg>`;
}
function smallMultiples(series, key, opts = {}){
  const wk = opts.gran === 'week';
  return `<div class="mc-grid">${KPI_DEFS.map(d => `<div class="mc-cell"><div class="mc-t">${d.k === 'vol' ? (opts.network ? 'Pedidos via 3PL' : 'Pedidos') + (wk ? ' por semana' : ' por mês') : d.label}<span>${d.k === 'vol' ? (opts.network ? 'total' : wk ? 'mínimo 10 mil/mês (ver ritmo no detalhe)' : 'mínimo ' + thrTxt(d, 'entry')) : 'meta ' + thrTxt(d, 'entry')}</span></div>${miniChart(d, series, key, opts)}</div>`).join('')}</div>
    <div class="sc-legend" style="margin-top:4px"><span><span class="sw" style="background:#FFE9E2;border-radius:2px"></span>período selecionado</span><span>- - - linha de meta</span>${LV_ORDER.map(l => `<span><span class="sw" style="background:${LV_COLOR[l]}"></span>${LV[l].ic} ${LV[l][opts.carrier ? 'cl' : 'l']}</span>`).join('')}</div>`;

/* sparkline de OTDR mensal (tabela) */
function sparkOTDR(name, key){
  const s = seriesOf(name, 'month').map(r => r ? r.otdr : null), [ia, ib] = monthIdxRange(key);
  const have = s.filter(v => v != null); if(have.length < 2) return '<span style="color:var(--grey-mid);font-size:11px">—</span>';
  const W = 92, H = 26, lo = Math.min(...have, .9) - .01, hi = Math.max(...have, .9) + .01, n = s.length;
  const X = i => 3 + (W - 6) * i / (n - 1), Y = v => H - 3 - (v - lo) / (hi - lo) * (H - 6);
  let p = '', pen = false; s.forEach((v, i) => { if(v == null){ pen = false; return; } p += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="spark"><rect x="${X(ia) - 2}" y="0" width="${X(ib) - X(ia) + 4}" height="${H}" class="mc-sel"/><line x1="0" x2="${W}" y1="${Y(.9)}" y2="${Y(.9)}" class="sp-ref"/><path d="${p}" class="sp-line"/>${s[ib] != null ? `<circle cx="${X(ib)}" cy="${Y(s[ib])}" r="2.8" fill="${LV_COLOR[kpiStatus(KDEF.otdr, s[ib])]}"/>` : ''}</svg>`;
}

function volOnlyNote(rows){
  const off = rows.filter(r => r.level === 'off'), only = off.filter(r => KPI_DEFS.every(d => d.k === 'vol' || r.st[d.k] !== 'off')).length;
