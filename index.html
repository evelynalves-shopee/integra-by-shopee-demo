  return off.length ? `<div class="note-box" style="margin:0 0 10px">💡 Das <b>${intF(off.length)}</b> transportadoras em Offboarding, <b>${intF(only)}</b> estão nesse nível só por <b>volume &lt; 8 mil</b>; <b>${intF(big)}</b> têm volume ≥ 8 mil e falham em indicador de qualidade. Use o filtro de volume na tabela para focar nelas.</div>` : '';
}
const jsArg = s => esc(JSON.stringify(s));
function distRow(label, rows, wf, fmt){
  const tot = rows.reduce((s, r) => s + wf(r), 0);
  const seg = LV_ORDER.map(l => [l, rows.filter(r => r.level === l).reduce((s, r) => s + wf(r), 0)]).filter(([, v]) => v > 0);
  return `<div class="dist-row"><div class="lb"><span>${label}</span><span>${label.startsWith('Vol') ? intF(tot) + ' pedidos' : intF(tot) + ' 3PLs'}</span></div>
    <div class="dist-bar">${seg.map(([l, v]) => `<div class="b-${l}" style="flex:${v}" title="${LV[l].l}: ${fmt(v, tot)}" onclick="setLvlFilter('${l}')">${v / tot > .07 ? LV[l].ic + ' ' + fmt(v, tot) : ''}</div>`).join('')}</div></div>`;
}
function setLvlFilter(l){ KP.lvl = KP.lvl === l ? 'todos' : l; KP.limit = 50; render(); const t = document.getElementById('pf-rows'); if(t && l !== 'todos') t.closest('.card').scrollIntoView({ behavior:'smooth', block:'start' }); }
function perfFiltered(){
  const q = KP.q.trim().toLowerCase();
  const vf = { todos: () => true, '10k': v => v >= 10000, '8k': v => v >= 8000 && v < 10000, lt8k: v => v < 8000, '1k': v => v >= 1000 };
  let list = periodRows(KP.period).filter(r => (KP.noProv || !r.noProv) && (!q || r.n.toLowerCase().includes(q))
    && (KP.lvl === 'todos' || r.level === KP.lvl) && (KP.kpi === 'todos' || r.fails.includes(KP.kpi)) && vf[KP.vol](r.vol));
  const k = KP.sort, dir = KP.dir;
  const val = r => k === 'n' ? r.n.toLowerCase() : k === 'level' ? LV[r.level].rank : (r[k] == null ? -Infinity : r[k]);
  list.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || b.vol - a.vol; });
  return list;
}
function sortBy(k){ if(KP.sort === k) KP.dir *= -1; else { KP.sort = k; KP.dir = k === 'n' ? 1 : -1; } perfRows(); }
function perfRows(){
  const th = (k, l, num) => `<th class="sort ${num ? 'num' : ''}" onclick="sortBy('${k}')">${l}${KP.sort === k ? (KP.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;

}

/* gráfico de dispersão OTDR × SDD (SVG puro) */
function drawScatter(){
  const wrap = $('sc-wrap'); if(!wrap) return;
  const pts = periodRows(KP.period).filter(r => !r.noProv && r.vol >= KP.scMin && r.otdr != null && r.sdd != null);
  const W = 640, H = 380, m = { l:46, r:16, t:16, b:40 };
  const x0 = Math.min(.80, Math.floor(Math.min(...pts.map(p => p.otdr)) * 20) / 20), x1 = 1;
  const y0 = Math.min(.20, Math.floor(Math.min(...pts.map(p => p.sdd)) * 20) / 20), y1 = Math.max(.45, Math.ceil(Math.max(...pts.map(p => p.sdd)) * 20) / 20);
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const maxV = Math.max(...pts.map(p => p.vol)), R = v => 4 + 15 * Math.sqrt(v / maxV);
  let g = '';
  for(let v = x0; v <= x1 + 1e-9; v += .05) g += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}"/><text class="ax" x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
  for(let v = y0; v <= y1 + 1e-9; v += .05) g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  g += `<text class="ax" x="${(W + m.l) / 2}" y="${H - 6}" text-anchor="middle">OTDR (entrega no prazo)</text><text class="ax" transform="translate(12 ${(H - m.b + m.t) / 2}) rotate(-90)" text-anchor="middle">SDD (mesmo dia)</text>`;
  g += `<rect x="${X(.90)}" y="${m.t}" width="${X(x1) - X(.90)}" height="${Y(.32) - m.t}" fill="#E7F8F5" opacity=".6"/>`;
  g += `<text class="reflb" x="${W - m.r - 6}" y="${m.t + 14}" text-anchor="end" style="fill:#0F6B5F">Atende OTDR e SDD</text>`;
  g += `<line class="ref" x1="${X(.90)}" x2="${X(.90)}" y1="${m.t}" y2="${H - m.b}"/><text class="reflb" x="${X(.90) - 4}" y="${H - m.b - 6}" text-anchor="end">meta 90%</text>`;
  g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(.32)}" y2="${Y(.32)}"/><text class="reflb" x="${m.l + 4}" y="${Y(.32) - 5}">meta 32%</text>`;
  const sorted = pts.slice().sort((a, b) => b.vol - a.vol);
  g += sorted.map((p, i) => `<circle class="dot" data-i="${i}" cx="${X(p.otdr)}" cy="${Y(p.sdd)}" r="${R(p.vol)}" fill="${LV_COLOR[p.level]}"/>`).join('');
  g += sorted.slice(0, 3).map(p => `<text class="dlb" x="${X(p.otdr) + R(p.vol) + 3}" y="${Y(p.sdd) + 4}">${esc(p.n)}</text>`).join('');
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dispersão OTDR por SDD">${g}</svg><div class="sc-tip" id="sc-tip"></div>
    <div class="sec-desc" style="margin:6px 0 0">${pts.length} transportadoras exibidas. Passe o mouse para ver os números; clique para abrir o detalhe.</div>`;
  const tip = $('sc-tip');
  wrap.querySelectorAll('.dot').forEach(el => {
    const p = sorted[+el.dataset.i];
    el.addEventListener('mouseenter', () => {
      tip.innerHTML = `<b>${esc(p.n)}</b><br>${intF(p.vol)} pedidos${volNorm(KP.period) ? '/mês (ritmo)' : ''}<br>OTDR ${pctF(p.otdr)} · SDD ${pctF(p.sdd)}<br>Nível: ${LV[p.level].ic} ${LV[p.level].l}`;
      const bw = wrap.clientWidth, sx = bw / W, cx = +el.getAttribute('cx') * sx, cy = +el.getAttribute('cy') * sx;
      tip.style.left = Math.min(Math.max(cx + 12, 0), bw - 190) + 'px'; tip.style.top = Math.max(cy - 70, 0) + 'px'; tip.classList.add('on');
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('on'));
    el.addEventListener('click', () => openPerfDetail(p.n));
  });
}

      <b>Período livre:</b> a base é diária (data de pagamento) e a semana vai de segunda a domingo. Fora de um mês fechado, o volume é convertido para ritmo mensal (total ÷ dias × 30,4) para comparar com o mínimo de 10 mil/mês; percentuais são ponderados pelo volume de cada dia. Comparação: período anterior com o mesmo nº de dias — nos atalhos de mês, os mesmos dias dos meses civis anteriores.<br><br>

const METROS = [

  ['Porto Alegre e região', [['POA · Centro','CEP 900'],['POA · Zona Norte','CEP 913'],['Canoas','CEP 924'],['Gravataí / Cachoeirinha','CEP 940'],['Novo Hamburgo','CEP 933']]],
];
const SELLER_A = ['Casa','Mundo','Loja','Império','Ponto','Universo','Planeta','Toque','Estilo','Vila','Point','Mega','Top','Bella','Nova'];
const SELLER_B = ['das Utilidades','Fit','Tech','Kids','Pet','Beauty','Decor','Moda','Fashion','Games','Cell','Outlet','Shoes','Home','Store','Acessórios','Esportes','Variedades','Import','Bijoux'];
const FIRST = ['Carlos','Rafael','Bruno','Anderson','Diego','Lucas','Marcos','Felipe','Thiago','Rodrigo','Juliana','Camila','Fernanda','Patrícia','Leandro','Gustavo','Vinícius','Matheus','Eduardo','Ricardo','Aline','Sérgio','Wellington','Renato','Fábio','Jéssica','Douglas','Paulo','André','Leonardo'];
const LASTI = 'ABCDFGLMNOPRSTV';

const SEG_DIMS = {
  area:   { label:'Área de cobertura', one:'área', many:'áreas', all:'todas as áreas', sd:{ otdr:.030, sdd:.045, fa:.012, mon:.035 }, mn:.12 },
  seller: { label:'Vendedores', one:'vendedor', many:'vendedores', all:'todos os vendedores', sd:{ otdr:.035, sdd:.090, fa:.015, mon:.040 }, mn:.20 },
  driver: { label:'Motoristas', one:'motorista', many:'motoristas', all:'todos os motoristas', sd:{ otdr:.050, sdd:.060, fa:.025, mon:.045 }, mn:.15 },
};
const SEG_K = ['otdr','sdd','fa','mon'];
const QDEFS = KPI_DEFS.filter(d => d.k !== 'vol');
const SMALL_N = 30; // amostra pequena: não entra em "onde agir"
const _segBase = {}, _segMon = {}, _segRows = {};

function segBase(name){
  if(_segBase[name]) return _segBase[name];
  const row = KPI_HIST.rows.find(r => r[0] === name), maxVol = Math.max(...row[1]), R = rng(hashStr(name));
  const off = sd => Object.fromEntries(SEG_K.map(k => [k, gauss(R) * sd[k]]));
  const metro = METROS[hashStr(name + '#m') % METROS.length];
  const nA = Math.max(1, Math.min(metro[1].length, Math.round(1.5 + Math.log10(maxVol + 1) * 1.1)));
  const area = metro[1].slice(0, nA).map(([n, sub], j) => ({ id:'A' + j, n, sub: metro[0] + ' · ' + sub, w: Math.exp(gauss(R) * .6) * (1 - j * .06), off: off(SEG_DIMS.area.sd) }));
  const nS = Math.max(1, Math.min(1500, Math.round(Math.pow(maxVol, .55) / 2)));
  const used = new Set();
  const seller = Array.from({ length: nS }, (_, j) => {
    let n; do { n = SELLER_A[Math.floor(R() * SELLER_A.length)] + ' ' + SELLER_B[Math.floor(R() * SELLER_B.length)]; if(used.has(n)) n += ' ' + (2 + Math.floor(R() * 8)); } while(used.has(n)); used.add(n);
    return { id:'S' + j, n, sub:'shop_id ' + (100000000 + Math.floor(R() * 899999999)), w: Math.pow(j + 1, -.95) * Math.exp(gauss(R) * .3), off: off(SEG_DIMS.seller.sd) };
  });
  const nD = Math.max(1, Math.min(2500, Math.ceil(maxVol / 480)));
  const driver = Array.from({ length: nD }, (_, j) => ({ id:'D' + j, n: FIRST[Math.floor(R() * FIRST.length)] + ' ' + LASTI[Math.floor(R() * LASTI.length)] + '.', sub:'MT-' + String(1000 + j * 7 + Math.floor(R() * 7)).padStart(4, '0'), w: Math.exp(gauss(R) * .45), off: off(SEG_DIMS.driver.sd) }));
  return _segBase[name] = { row, area, seller, driver, metro: metro[0] };
}
/* itens de uma dimensão em um mês (volumes inteiros que somam o total; % recentrados no resultado do mês) */
function segMonth(name, dim, i){
  const key = name + '|' + dim + '|' + i; if(_segMon[key]) return _segMon[key];
  const B = segBase(name), V = B.row[1][i]; if(!V) return _segMon[key] = null;
  const R = rng(hashStr(key)), items = B[dim], sd = SEG_DIMS[dim].sd;
  const w = items.map(it => it.w * Math.exp(gauss(R) * SEG_DIMS[dim].mn)), W = w.reduce((s, x) => s + x, 0);
  const raw = w.map(x => x / W * V), vol = raw.map(Math.floor); let rest = V - vol.reduce((s, x) => s + x, 0);
  raw.map((x, j) => [x - Math.floor(x), j]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, j]) => vol[j]++);
  const out = items.map((it, j) => ({ j, vol: vol[j] }));
  SEG_K.forEach(k => {
    const base = B.row[KIDX[k]][i]; if(base == null){ out.forEach(o => o[k] = null); return; }
    const b = base / 1e4, dev = items.map(it => it.off[k] + gauss(R) * sd[k] * .35);
    const mean = dev.reduce((s, x, j) => s + x * vol[j], 0) / V;
    out.forEach((o, j) => o[k] = Math.max(0, Math.min(1, b + dev[j] - mean)));
  });
  return _segMon[key] = out;
}
function segRows(name, dim, pkey){
  const ck = name + '|' + dim + '|' + pkey; if(_segRows[ck]) return _segRows[ck];
  const B = segBase(name), items = B[dim], p = PIDX[name], [a, b] = pParts(pkey);
  const ia = Math.max(0, dIdx(a)), ib = Math.min(ND - 1, dIdx(b)), mv = {};
  for(let i = ia; i <= ib; i++){ const v = VOL[p * ND + i]; if(v) mv[DMON[i]] = (mv[DMON[i]] || 0) + v; }
  /* cada mês entra na proporção do volume do período dentro do mês */
  const acc = items.map(it => ({ it, vol:0, s:{ otdr:[0,0], sdd:[0,0], fa:[0,0], mon:[0,0] } }));
  Object.entries(mv).forEach(([mi, pv]) => { const m = segMonth(name, dim, +mi); if(!m) return; const f = pv / B.row[1][+mi];
    m.forEach(o => { const A = acc[o.j], w = o.vol * f; if(!w) return; A.vol += w; SEG_K.forEach(k => { if(o[k] != null){ A.s[k][0] += o[k] * w; A.s[k][1] += w; } }); }); });
  /* volumes inteiros que fecham com o total do período */
  const T = Object.values(mv).reduce((s, x) => s + x, 0), base = acc.map(x => Math.floor(x.vol));
  let rest = T - base.reduce((s, x) => s + x, 0);
  acc.map((x, j) => [x.vol - Math.floor(x.vol), j]).sort((x, y) => y[0] - x[0]).slice(0, Math.max(0, rest)).forEach(([, j]) => base[j]++);
  let rows = acc.map((x, j) => ({ x, v: base[j] })).filter(o => o.v > 0).map(({ x, v }) => {
    const r = { id: x.it.id, j: +x.it.id.slice(1), n: x.it.n, sub: x.it.sub, vol: v, share: v / T, st:{} };
    SEG_K.forEach(k => r[k] = x.s[k][1] ? x.s[k][0] / x.s[k][1] : null);
    return r;
  });
  /* recentra os % no resultado da transportadora no período */
  const pr = provRow(pkey, name);
  if(pr) SEG_K.forEach(k => { if(pr[k] == null) return; let s = 0, n = 0; rows.forEach(r => { if(r[k] != null){ s += r[k] * r.vol; n += r.vol; } });
    if(n){ const sh = pr[k] - s / n; rows.forEach(r => { if(r[k] != null) r[k] = Math.max(0, Math.min(1, r[k] + sh)); }); } });
  rows.forEach(r => {
    QDEFS.forEach(d => r.st[d.k] = kpiStatus(d, r[d.k]));
    r.small = r.vol < SMALL_N;
    r.level = QDEFS.map(d => r.st[d.k]).reduce((p, s) => LV[s].rank > LV[p].rank ? s : p, 'ok');
    r.fails = QDEFS.filter(d => r.st[d.k] !== 'ok' && r.st[d.k] !== 'na').map(d => d.k);
    r.late = r.otdr != null ? r.vol * (1 - r.otdr) : 0;
  });
  return _segRows[ck] = rows;
}
function segSpark(name, dim, j, pkey){
  const s = MONTHS.map((m, i) => { const x = segMonth(name, dim, i); return x && x[j].vol ? x[j].otdr : null; });
  const [ia, ib] = monthIdxRange(pkey), have = s.filter(v => v != null);
  if(have.length < 2) return '<span style="color:var(--grey-mid);font-size:11px">—</span>';
  const W = 84, H = 24, lo = Math.min(...have, .9) - .01, hi = Math.max(...have, .9) + .01, n = s.length;
  const X = i => 3 + (W - 6) * i / (n - 1), Y = v => H - 3 - (v - lo) / (hi - lo) * (H - 6);
  let p = '', pen = false; s.forEach((v, i) => { if(v == null){ pen = false; return; } p += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="spark"><rect x="${X(ia) - 2}" y="0" width="${X(ib) - X(ia) + 4}" height="${H}" class="mc-sel"/><line x1="0" x2="${W}" y1="${Y(.9)}" y2="${Y(.9)}" class="sp-ref"/><path d="${p}" class="sp-line"/></svg>`;
}

/* ---------- UI ---------- */
const SEG = { dim:'geral', q:'', kpi:'todos', sort:'late', dir:-1, limit:25, name:null, key:null, carrier:true };
function segSection(name, pkey, carrier){
  if(SEG.name !== name){ SEG.dim = 'geral'; SEG.q = ''; SEG.kpi = 'todos'; SEG.limit = 25; }
  Object.assign(SEG, { name, key: pkey, carrier });
  return `<div class="card seg-card" id="seg-card"><div class="sec-title"><h3>Visão operacional</h3><span>${esc(perLabel(pkey))} · <span class="sim-badge">⚗️ Segmentação simulada</span></span></div><div id="seg-body"></div></div>`;
}
function setSeg(k, v){ SEG[k] = v; if(k !== 'limit') SEG.limit = 25; drawSeg(); }
function segSortBy(k){ if(SEG.sort === k) SEG.dir *= -1; else { SEG.sort = k; SEG.dir = k === 'n' ? 1 : -1; } drawSeg(); }
const lvLabel = s => LV[s][SEG.carrier ? 'cl' : 'l'];
function segPill(s){ return `<span class="st ${LV[s].cls}"><i>${LV[s].ic}</i>${lvLabel(s)}</span>`; }
function drawSeg(){
  const body = $('seg-body'); if(!body) return;
  const { name, key } = SEG, B = segBase(name);
  const counts = Object.fromEntries(Object.keys(SEG_DIMS).map(d => [d, segRows(name, d, key).length]));
  const tabs = `<div class="seg-tabs" role="tablist">${[['geral','📊 Desempenho geral'], ...Object.entries(SEG_DIMS).map(([d, D]) => [d, ({ area:'📍 ', seller:'🏪 ', driver:'🛵 ' })[d] + D.label + ` <span class="seg-n">${intF(counts[d])}</span>`])]
    .map(([d, l]) => `<button type="button" role="tab" class="${SEG.dim === d ? 'on' : ''}" onclick="setSeg('dim','${d}')">${l}</button>`).join('')}</div>`;
  body.innerHTML = tabs + (SEG.dim === 'geral' ? segOverview(name, key, B) : segTable(name, SEG.dim, key));
  bindTips(body);
}
function segOverview(name, key, B){
  const r = provRow(key, name), totLate = r.otdr != null ? r.volTot * (1 - r.otdr) : 0;
  const col = dim => {
    const D = SEG_DIMS[dim], rows = segRows(name, dim, key), big = rows.filter(x => !x.small);
    const below = big.filter(x => x.level !== 'ok').length;
    const byLv = LV_ORDER.map(l => [l, rows.filter(x => x.level === l).reduce((s, x) => s + x.vol, 0)]).filter(([, v]) => v > 0), tv = rows.reduce((s, x) => s + x.vol, 0);
    const top = big.slice().sort((a, b) => b.late - a.late).slice(0, 3), topLate = top.reduce((s, x) => s + x.late, 0);
    return `<div class="seg-col">
      <div class="seg-col-h"><b>${({ area:'📍', seller:'🏪', driver:'🛵' })[dim]} ${D.label}</b><span>${intF(rows.length)} ${D.many}</span></div>
      <div class="seg-big">${intF(below)}<small> de ${intF(big.length)}</small></div>
      <div class="seg-cap">${D.many} fora da meta em pelo menos 1 indicador${rows.length > big.length ? ` <span title="Itens com menos de ${SMALL_N} pedidos não entram na conta">(sem amostras &lt; ${SMALL_N} pedidos)</span>` : ''}</div>
      <div class="dist-bar seg-dist">${byLv.map(([l, v]) => `<div class="b-${l}" style="flex:${v}" data-tip="<b>${lvLabel(l)}</b><br>${pctF(v / tv, 1)} dos pedidos">${v / tv > .12 ? LV[l].ic + ' ' + pctF(v / tv, 0) : ''}</div>`).join('')}</div>
      <div class="seg-cap" style="margin:4px 0 10px">% dos pedidos por status</div>
      <div class="seg-sub">Onde agir primeiro <span>pedidos fora do prazo</span></div>
      ${top.map(x => `<div class="seg-top" onclick="SEG.q=${jsArg(x.n)};setSeg('dim','${dim}')"><div style="min-width:0"><b>${esc(x.n)}</b><div class="seg-cap">${intF(x.vol)} pedidos · OTDR ${pctF(x.otdr, 1)}</div></div><span class="seg-late">${intF(x.late)}</span></div>`).join('') || '<div class="seg-cap">Sem itens com amostra suficiente.</div>'}
      ${top.length && totLate ? `<div class="seg-cap" style="margin-top:6px">Esses ${top.length} concentram <b>${pctF(topLate / totLate, 0)}</b> dos pedidos fora do prazo.</div>` : ''}

  };

    <div class="seg-grid">${['area','seller','driver'].map(col).join('')}</div>`;
}
function segTable(name, dim, key){
  const D = SEG_DIMS[dim], q = SEG.q.trim().toLowerCase();
  let rows = segRows(name, dim, key).filter(x => (!q || (x.n + ' ' + x.sub).toLowerCase().includes(q)) && (SEG.kpi === 'todos' || (SEG.kpi === 'any' ? x.level !== 'ok' : x.fails.includes(SEG.kpi))));
  const k = SEG.sort, val = x => k === 'n' ? x.n.toLowerCase() : k === 'level' ? LV[x.level].rank : (x[k] == null ? -Infinity : x[k]);
  rows.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * SEG.dir || b.vol - a.vol; });
  const shown = rows.slice(0, SEG.limit), maxLate = Math.max(1, ...rows.map(x => x.late));
  const th = (k, l, num) => `<th class="sort ${num ? 'num' : ''}" onclick="segSortBy('${k}')">${l}${SEG.sort === k ? (SEG.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const note = { area:'Áreas da sua base de atuação (agrupamento por faixa de CEP do comprador). A cobertura (% de CEPs atendidos) entra quando houver base.', seller:'Vendedores atendidos no período. SDD e OTDR variam muito com o horário de liberação dos pacotes de cada vendedor.', driver:'Motoristas que fizeram entregas no período (informados pela transportadora via TMS/API).' }[dim];
  return `<p class="sec-desc" style="margin:2px 0 10px">${note}</p>
    <div class="toolbar">
      <input type="search" placeholder="Buscar ${D.one}…" value="${esc(SEG.q)}" oninput="SEG.q=this.value;SEG.limit=25;clearTimeout(SEG._t);SEG._t=setTimeout(()=>{drawSeg();const i=document.querySelector('#seg-body input[type=search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250)">
      <select onchange="setSeg('kpi',this.value)"><option value="todos">Todos</option><option value="any" ${SEG.kpi === 'any' ? 'selected' : ''}>Fora da meta em algum indicador</option>${QDEFS.map(d => `<option value="${d.k}" ${SEG.kpi === d.k ? 'selected' : ''}>Fora da meta em: ${d.short}</option>`).join('')}</select>
      <select onchange="SEG.sort=this.value;SEG.dir=this.value==='n'?1:-1;drawSeg()">${[['late','Ordenar: mais pedidos fora do prazo'],['vol','Ordenar: mais pedidos'],['otdr','Ordenar: OTDR'],['sdd','Ordenar: SDD'],['fa','Ordenar: 1ª tentativa'],['n','Ordenar: nome']].map(([v, l]) => `<option value="${v}" ${SEG.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div style="overflow-x:auto"><table class="pf-table seg-table"><thead><tr><th>#</th>${th('n', D.one[0].toUpperCase() + D.one.slice(1))}${th('vol', 'Pedidos', true)}<th class="num">% vol.</th>${QDEFS.map(d => th(d.k, d.short + `<div style="font-weight:600;text-transform:none;font-size:10.5px;color:var(--grey-mid)">meta ${thrTxt(d, 'entry')}</div>`, true)).join('')}${th('late', 'Fora do prazo', true)}<th>OTDR mensal</th>${th('level', 'Status')}</tr></thead><tbody>
      ${shown.map((x, i) => `<tr class="${x.small ? 'small' : ''}"><td style="color:var(--grey-dark);font-size:12px">${i + 1}</td>
        <td><b>${esc(x.n)}</b><div style="font-size:11.5px;color:var(--grey-dark)">${esc(x.sub)}${x.small ? ' · <i>amostra pequena</i>' : ''}</div></td>
        <td class="num">${intF(x.vol)}</td><td class="num" style="color:var(--grey-dark)">${pctF(x.share, 1)}</td>
        ${QDEFS.map(d => `<td class="num"><span class="mv ${LV[x.st[d.k]].cls}"><i>${LV[x.st[d.k]].ic}</i>${fmtK(d, x[d.k], 1)}</span></td>`).join('')}
        <td class="num"><div class="late-bar"><span style="width:${x.late / maxLate * 100}%"></span></div>${intF(x.late)}</td>
        <td>${segSpark(name, dim, x.j, key)}</td>
        <td>${segPill(x.level)}</td></tr>`).join('') || `<tr><td colspan="11" style="text-align:center;color:var(--grey-dark);padding:26px">Nenhum resultado encontrado com esses filtros.</td></tr>`}
    </tbody></table></div>
    <div class="pf-more"><span>Mostrando ${intF(shown.length)} de ${intF(rows.length)} ${D.many}</span>${rows.length > shown.length ? `<button class="btn btn-secondary btn-sm" onclick="setSeg('limit',SEG.limit+50)">Mostrar mais</button>` : ''}</div>`;
}
